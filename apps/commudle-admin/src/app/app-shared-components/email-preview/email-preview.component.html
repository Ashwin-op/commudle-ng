<com-card class="template-card">
  <com-card-header
    ><h3>Email Preview</h3>
    <button ghost nbButton size="small" shape="round" (click)="closePopup()">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <p class="sample-preview">This is a preview of your email</p>
    <div class="info-message">
      <commudle-alert
        warning="This preview might contain some dummy values, please ignore them. The email being sent to the user will be with actual values."
      ></commudle-alert>
    </div>
    <div [innerHTML]="previewData | safe : 'html'" class="inner-html"></div>
  </com-card-body>
  <com-card-footer>
    <button nbButton status="primary" shape="semi-round" (click)="closePopup()">Close</button>
  </com-card-footer>
</com-card>
