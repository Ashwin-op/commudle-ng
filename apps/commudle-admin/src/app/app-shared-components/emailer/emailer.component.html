<com-card class="emailer-component">
  <com-card-header class="emailer-dialog-header">
    <h3>{{ title }}</h3>
    <button comButton ghost size="small" shape="round" (click)="close()">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body class="emailer-dialog-body">
    <form [formGroup]="eMailForm">
      <div *ngIf="showEmailFilters" class="filters">
        <div class="filter">
          <label for="members">Filter Emails By:</label>
          <select
            name="members"
            formControlName="members"
            (change)="toggleEventSpecificEmail($any($event.target).value)"
          >
            <option value="" disabled>Filter Emails</option>
            <option selected value="{{ EemailTypes.GENERAL_ALL }}" title="General Email (To All or a Specific Member)">
              General Email (To All or a Specific Member)
              <commudle-help-section [helpDictionaryName]="'community-general-email'"></commudle-help-section>
            </option>
            <option value="{{ EemailTypes.EVENT_SPEAKER }}" title="Send email only to speakers of the event">
              To All Speakers
            </option>
            <option value="event" title="Send email to a specific event's participants">
              Event Specific Emails
              <commudle-help-section [helpDictionaryName]="'event-specific-mails'"></commudle-help-section>
            </option>
          </select>
        </div>

        <div *ngIf="isEventSpecificEmail" class="filters">
          <div class="filter">
            <label for="form-select">Select Event:</label>
            <select (change)="getEventDataFormEntityGroups($any($event.target).value)" formControlName="event_id">
              <option value="null" selected disabled>Select Event</option>
              <option *ngFor="let event of events" [value]="event.id">
                {{ event.name }}
              </option>
            </select>
          </div>

          <div class="form-mail-type-selection filters">
            <div *ngIf="eventDataFormEntityGroups.length > 0" class="filter">
              <label for="form-select">Select Form Type:</label>
              <select
                (change)="toggleEventDataFormEntityGroupType($any($event.target).value)"
                formControlName="event_data_form_entity_group_id"
                name="event_data_form_entity_group_id"
              >
                <option value="null" selected disabled>Select Form</option>
                <option *ngFor="let edfeg of eventDataFormEntityGroups" [value]="edfeg.id">
                  {{ edfeg.name }}
                </option>
              </select>
            </div>
            <div *ngIf="eventSimpleRegistration">
              <p>Single Click Registration</p>
            </div>

            <div *ngIf="selectedEventDataFormEntityGroup || eventSimpleRegistration" class="filter">
              <label for="form-select">Send Form To:</label>
              <select
                *ngIf="selectedEventDataFormEntityGroup && selectedFormRegistrationType.length > 0"
                (change)="toggleEmailBodyValidation($any($event.target).value)"
                formControlName="registration_selection_type"
              >
                <option value="" disabled selected>Let's Be Specific!</option>
                <option *ngFor="let reg of selectedFormRegistrationType" [value]="reg.value">
                  {{ reg.display }}
                </option>
              </select>

              <select
                *ngIf="eventSimpleRegistration && selectedFormRegistrationType.length > 0"
                (change)="toggleEmailBodyValidation($any($event.target).value)"
                formControlName="registration_selection_type"
                name="registration_selection_type"
              >
                <option value="" selected disabled>Let's Be Specific!</option>
                <option *ngFor="let reg of selectedFormRegistrationType" [value]="reg.value">
                  {{ reg.display }}
                </option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div
        *ngIf="
          [
            EemailTypes.GENERAL_ALL,
            EemailTypes.ENTRY_PASS,
            EemailTypes.SEND_LINK,
            EemailTypes.RSVP,
            EemailTypes.CANCELED
          ].includes(selectedEmailType) === true
        "
        class="fieldset"
      >
        <div>
          <label *ngIf="recipientUsername" class="label">
            To
            <br />
            <b>Selected Username</b>: <u>{{ recipientUsername }}</u>
          </label>
          <label *ngIf="!recipientUsername" for="recipient_email" class="label">To</label>
          <input
            *ngIf="!recipientUsername"
            formControlName="recipient_email"
            fullWidth
            nbInput
            placeholder="Enter 1 email addresses or leave blank for all matching members"
            type="text"
            fieldSize="small"
          />
        </div>
        <div class="resend-mail">
          <nb-checkbox formControlName="resend" status="basic"> Resend (if already sent)</nb-checkbox>
        </div>
      </div>
      <div class="fieldset">
        <label for="subject" class="label"> Subject<span class="mandatory-field">*</span></label>
        <input
          formControlName="subject"
          fullWidth
          fieldSize="small"
          nbInput
          type="text"
          placeholder="Add Your Subject Line"
        />
        <span
          *ngIf="
            eMailForm['controls'].subject.touched &&
            eMailForm['controls'].subject.invalid &&
            eMailForm['controls'].subject.errors.required
          "
        >
          <commudle-alert [error]="true" [errorMessage]="'Required Field'"></commudle-alert>
        </span>
      </div>
      <div class="fieldset">
        <label class="label"
          >Message From Organizers<span *ngIf="!isEventSpecificEmail" class="mandatory-field">*</span></label
        >
        <editor [init]="tinyMCE" formControlName="body"> </editor>
      </div>
      <div class="action-btns">
        <button
          (click)="previewEmail(); $event.stopPropagation()"
          [disabled]="
            !eMailForm.valid ||
            isEmailSending ||
            (isEventSpecificEmail && !eMailForm.get('event_id').value) ||
            (eventDataFormEntityGroups.length > 0 &&
              !eMailForm.get('event_data_form_entity_group_id').value &&
              isEventSpecificEmail) ||
            ((selectedEventDataFormEntityGroup || eventSimpleRegistration) &&
              !eMailForm.get('registration_selection_type').value &&
              isEventSpecificEmail)
          "
          nbButton
          status="primary"
          shape="semi-round"
          type="button"
        >
          Preview Email
        </button>
        <button
          (click)="submitForm()"
          [disabled]="
            !eMailForm.valid ||
            isEmailSending ||
            (isEventSpecificEmail && !eMailForm.get('event_id').value) ||
            (!eMailForm.get('event_data_form_entity_group_id').value && isEventSpecificEmail) ||
            ((selectedEventDataFormEntityGroup || eventSimpleRegistration) &&
              !eMailForm.get('registration_selection_type').value &&
              isEventSpecificEmail)
          "
          fullWidth
          nbButton
          status="primary"
          type="submit"
          class="submit-button"
          shape="semi-round"
        >
          Send Mail
        </button>
      </div>
    </form>
  </com-card-body>
</com-card>
<ng-template #emailPreview let-ref="dialogRef">
  <com-card class="template-card">
    <com-card-header>
      <h3>Email Preview</h3>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <p class="sample-preview">This is a preview of your email</p>
      <div class="info-message">
        <commudle-alert
          [info]="true"
          message="This preview might contain some dummy values, please ignore them. The email being sent to the user will be with actual values."
        ></commudle-alert>
      </div>
      <div class="warning-message">
        <commudle-alert warning="This feature is in beta"> </commudle-alert>
      </div>
      <div [innerHTML]="previewData | safe : 'html'" class="inner-html"></div>
    </com-card-body>
    <com-card-footer>
      <button nbButton status="primary" shape="semi-round" (click)="ref.close()">Close</button>
    </com-card-footer>
  </com-card>
</ng-template>
