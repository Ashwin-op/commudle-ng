<div class="event">
  <a
    [routerLink]="['/communities', event.kommunity_slug, 'events', event.slug]"
    [ngClass]="horizontalScroll ? 'com-w-72' : 'com-w-full'"
  >
    <com-card>
      <com-card-body>
        <div *ngIf="event.header_image || event.header_image">
          <commudle-banner-image
            class="desktop-image"
            *appBreakpoints="'>lg'"
            [headerImagePath]="event.header_image_path || event.header_image?.i320"
            [name]="event.name"
            [bottomRightCurve]="false"
            [bottomLeftCurve]="false"
          ></commudle-banner-image>
          <commudle-banner-image
            class="mobile-image"
            *appBreakpoints="'<=lg'"
            [headerImagePath]="event.header_image_path || event.header_image?.i320"
            [name]="event.name"
            [aspectRatio]="'1/1'"
          ></commudle-banner-image>
        </div>
        <div *ngIf="!(event.header_image_path || event.header_image)">
          <div *appBreakpoints="'>lg'" class="without-header-image-desktop">
            <img
              alt="{{ event.name }}"
              src="{{ staticAssets.empty_state_desktop_past_events }}"
              title="{{ event.name }}"
            />
          </div>
          <div *appBreakpoints="'<=lg'" class="without-header-image-mobile">
            <img
              alt="{{ event.name }}"
              src="{{ staticAssets.empty_state_mobile_past_events }}"
              title="{{ event.name }}"
            />
          </div>
        </div>
        <div *appBreakpoints="'>lg'" class="details-container">
          <div class="event-details">
            <div class="details">
              <div class="completed" *ngIf="event.event_status.name === 'completed'">
                Completed
                <fa-icon [icon]="faCircleCheck" class="completed-icon" title="Completed"></fa-icon>
              </div>
              <div *ngIf="event.interested_members_count > 0" class="interested-members">
                <app-badge
                  [text]="event.interested_members_count"
                  [fontColor]="'com-text-tAuro-Metal-Saurus'"
                  [nbIcon]="'people-outline'"
                  [fontSize]="'small'"
                  [borderRadius]="'round'"
                  [color]="'com-bg-Bright-Gray-Light'"
                ></app-badge>
              </div>
            </div>
            <p class="event-name">
              {{ event.name }}
              <span
                *ngIf="showCollaborationTag && hostCommunity && event.kommunity_id !== hostCommunity.id"
                class="collaboration"
              >
                (Collaboration)
              </span>
            </p>
            <p class="event-timings">{{ moment(event.start_time).format('dddd, MMM Do, YYYY') }}</p>
            <div *ngIf="community && !hideCommunityNameBadge" class="community-badge">
              <app-community-badge [community]="community" [size]="'small'"></app-community-badge>
            </div>
          </div>
          <div class="view-actions">
            <button
              *ngIf="event?.speaker_resource?.id"
              type="button"
              class="view-slides"
              (click)="goToSpeakerSlides($event)"
            >
              View Slides
            </button>
            <span class="view-details">View Details</span>
          </div>
        </div>
        <div *appBreakpoints="'<=lg'" class="details-container-mobile">
          <div class="time-badge">
            <p class="event-time">{{ moment(event.start_time).format('dddd, MMM Do, YYYY') }}</p>
            <div class="interested-members" *ngIf="event.interested_members_count > 0">
              <app-badge
                [text]="event.interested_members_count"
                [fontColor]="'com-text-tAuro-Metal-Saurus'"
                [nbIcon]="'people-outline'"
                [fontSize]="'small'"
                [borderRadius]="'round'"
                [color]="'com-bg-Bright-Gray-Light'"
              ></app-badge>
            </div>
          </div>
          <p class="event-title">
            {{ event.name }}
            <span
              *ngIf="showCollaborationTag && hostCommunity && event.kommunity_id !== hostCommunity.id"
              class="collaboration"
            >
              (Collaboration)
            </span>
          </p>
          <div *ngIf="community && !hideCommunityNameBadge" class="community-badge">
            <app-community-badge [community]="community" [size]="'small'"></app-community-badge>
          </div>
          <div class="view-actions">
            <button
              *ngIf="event?.speaker_resource?.id"
              type="button"
              class="view-slides"
              (click)="goToSpeakerSlides($event)"
            >
              View Slides
            </button>
            <span class="view-details">View Details</span>
          </div>
        </div>
      </com-card-body>
    </com-card>
  </a>
</div>
