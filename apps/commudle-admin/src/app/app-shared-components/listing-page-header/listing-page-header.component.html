<div class="header">
  <div *ngIf="header" [ngStyle]="{ 'background-color': header.background_color.hex }" class="background">
    <div class="base-layout">
      <div class="content">
        <div class="header-text">
          <p *ngIf="header.pre_heading" class="pre-heading">{{ header.pre_heading }}</p>
          <h1 *ngIf="header.heading" class="heading">
            {{ header.heading }}
          </h1>
          <p *ngIf="header.sub_heading" class="sub-heading">{{ header.sub_heading }}</p>
          <div *ngIf="richText" [innerHTML]="richText | safe : 'html'" class="inner-html"></div>
        </div>
        <div class="image-wrapper" *ngIf="headerImgUrl">
          <commudle-campaign-assets-display
            *ngIf="showAd; else plainHeaderImage"
            [defaultImage]="headerImgUrl"
            [defaultImageUrl]="header.image_link"
          ></commudle-campaign-assets-display>
          <ng-template #plainHeaderImage>
            <a
              class="header-image"
              [href]="header.image_link"
              [ngClass]="{ 'com-pointer-events-none': !header.image_link }"
            >
              <img [src]="headerImgUrl" alt="" />
            </a>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
