<!-- Live Visitors -->
<article class="live-visitors-card">
  <header class="section-header">
    <h3 class="section-heading">
      <fa-icon [icon]="icons.faEye" class="heading-icon-visitors"></fa-icon> Live Visitors
    </h3>
  </header>
  <div class="live-visitors-body">
    <div class="live-visitors-counts">
      <div class="live-count">
        <span class="live-count-label">
          <span class="live-dot"></span>
          Live now
        </span>
        <span class="live-count-value">{{ liveVisitors?.live_count ?? '—' }}</span>
      </div>
      <div class="live-count">
        <span class="live-count-label">Last 30 min</span>
        <span class="live-count-value">{{ liveVisitors?.last_30_min_count ?? '—' }}</span>
      </div>
    </div>
    <div class="live-visitors-chart-wrap" [class.is-empty]="!liveVisitors?.history?.length">
      <canvas #liveVisitorsChartCanvas></canvas>
      <span *ngIf="!liveVisitors?.history?.length" class="live-visitors-chart-empty">
        Not enough data yet to chart.
      </span>
    </div>
  </div>
</article>

<!-- Slot for a dashboard-specific card that must sit between Live Visitors and Top
     Pages in grid order (e.g. hackathon's Setup Progress card). Empty otherwise. -->
<ng-content></ng-content>

<!-- Top Pages -->
<article class="top-list-card">
  <header class="section-header">
    <h3 class="section-heading"><fa-icon [icon]="icons.faFileLines" class="heading-icon-pages"></fa-icon> Top Pages</h3>
    <div class="top-pages-window-toggle">
      <button type="button" [class.active]="topPagesWindow === 'current'" (click)="onTopPagesWindowChange('current')">
        Live
      </button>
      <button type="button" [class.active]="topPagesWindow === '24h'" (click)="onTopPagesWindowChange('24h')">
        24h
      </button>
      <button type="button" [class.active]="topPagesWindow === '7d'" (click)="onTopPagesWindowChange('7d')">7d</button>
    </div>
  </header>
  <div class="top-list-header">
    <span>Page Title</span>
    <span>Views</span>
  </div>
  <ul class="top-list">
    <li *ngIf="topPagesLoading" class="section-loader">
      <app-loading-spinner></app-loading-spinner>
    </li>
    <ng-container *ngIf="!topPagesLoading">
      <li *ngFor="let page of topPages" class="top-list-item">
        <a
          [href]="page.url"
          target="_blank"
          rel="noopener noreferrer"
          class="top-list-name"
          [comTooltip]="page.url"
          tooltipSize="sm"
          tooltipPlacement="top"
          >{{ page.page_title }}</a
        >
        <span class="top-list-track">
          <span
            class="top-list-bar top-list-bar-pages"
            [style.--bar-share.%]="barShare(page.views, topPagesMax)"
          ></span>
        </span>
        <span class="top-list-value">{{ page.views | number }}</span>
      </li>
      <li *ngIf="topPages.length === 0" class="top-list-empty">
        <span class="top-list-empty-icon pages">
          <fa-icon [icon]="icons.faFileLines"></fa-icon>
        </span>
        <span class="top-list-empty-text">No page views yet.</span>
      </li>
    </ng-container>
  </ul>
  <commudle-pagination-compact
    *ngIf="topPagesTotal > topPagesCount"
    [page]="topPagesPage"
    [count]="topPagesCount"
    [total]="topPagesTotal"
    (pageChange)="onTopPagesPageChange($event)"
  ></commudle-pagination-compact>
</article>
