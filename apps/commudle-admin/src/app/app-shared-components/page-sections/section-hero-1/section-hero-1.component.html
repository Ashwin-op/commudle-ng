<div class="hero-section">
  <div class="base-layout container hero-container">
    <h1 class="hero-heading">{{ config.title }}</h1>
    <p class="hero-subtitle">{{ config.subtitle }}</p>
    <div *ngIf="config.ctaText" class="hero-cta">
      <button nbButton status="primary">{{ config.ctaText }}</button>
    </div>
  </div>
</div>
