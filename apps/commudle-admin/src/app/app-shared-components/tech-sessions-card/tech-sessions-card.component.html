<com-card [ngClass]="horizontalScroll ? 'com-w-72' : 'com-w-full'">
  <com-card-body>
    <a
      [routerLink]="
        session.embedded_content
          ? ['/speaker-resources', session.id]
          : ['/communities', session.event.kommunity.id, 'events', session.event.id]
      "
    >
      <p class="session-link">{{ session.title ? session.title : session.event.name }}</p>
      <p class="event-time">{{ moment(session.event.start_time).format('dddd, MMM Do, YYYY') }}</p>
      <app-user-profile-card-small [user]="session.user"></app-user-profile-card-small>
    </a>
  </com-card-body>
</com-card>
