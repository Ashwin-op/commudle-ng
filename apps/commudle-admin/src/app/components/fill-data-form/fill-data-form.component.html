<div class="data-form-container">
  <div *ngIf="dataFormEntity" class="base-layout fill-data-form">
    <div class="container">
      <div class="one-column-layout">
        <div>
          <com-card *ngIf="formClosed">
            <com-card-body> This form is closed! </com-card-body>
          </com-card>
        </div>

        <div *ngIf="!formClosed">
          <com-card class="header">
            <com-card-body>
              <p *ngIf="community" class="community">
                <app-community-badge [community]="community"></app-community-badge>
              </p>
              <div *ngIf="event" class="event">
                <div class="header-image">
                  <commudle-banner-image
                    *ngIf="event.header_image_path"
                    [headerImagePath]="event.header_image_path"
                    [name]="event.name"
                  ></commudle-banner-image>
                </div>
                <p class="event-name">{{ event.name }}</p>
              </div>
              <p class="form-name">{{ dataFormEntity.name }}</p>
              <commudle-alert
                [info]="
                  dataFormEntity?.event_data_form_entity_group?.is_paid &&
                  dataFormEntity?.event_data_form_entity_group?.approval_based_payments
                "
                message="This is an approval based registration process, if you are shortlisted then you will receive a link to make the payment and complete your registration."
              ></commudle-alert>
            </com-card-body>
          </com-card>

          <com-card *ngIf="showProfileForm" class="profile-form-card">
            <com-card-header> Let's Update Your Basic Profile! </com-card-header>
            <com-card-body>
              <div>
                <app-basic-user-profile></app-basic-user-profile>
              </div>
            </com-card-body>
          </com-card>
          <com-card *ngIf="dataFormEntity.user_details && currentUser" class="profile-form-card">
            <com-card-body>
              <commudle-user-details-form
                [userFormDetails]="dataFormEntity.user_details"
                [showActionButtons]="false"
                (submitUserDetailsEvent)="updateUserDetails($event)"
                (isLoadingEventEmitter)="submitButtonLoading = false"
              ></commudle-user-details-form>
            </com-card-body>
          </com-card>

          <div class="data-form-fill-body">
            <app-data-form-fill
              (formSubmitted)="updateUserDetailsAndSubmitForm($event)"
              [dataFormId]="dataFormEntity.data_form_id"
              [existingResponses]="selectedFormResponse"
              [eventId]="event ? event.id : ''"
              [submitButtonLoading]="submitButtonLoading"
            >
            </app-data-form-fill>
            <p *ngIf="dataFormEntity.multi_response" class="text-info">
              <i>* You can submit multiple responses for this form!</i>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
