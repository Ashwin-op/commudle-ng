<nb-actions>
  <nb-action>
    <a routerLink="communities" routerLinkActive="active">
      <fa-icon [icon]="faUserFriends"></fa-icon>
      <span>Communities</span>
    </a>
  </nb-action>
  <nb-action *ngIf="currentUser">
    <a routerLink="hackathons" routerLinkActive="active">
      <fa-icon [icon]="faTrophy"></fa-icon>
      <span>Hacks</span>
    </a>
  </nb-action>
  <nb-action>
    <a routerLink="events" routerLinkActive="active">
      <fa-icon [icon]="faCalendarDays"></fa-icon>
      <span>Events</span>
    </a>
  </nb-action>
  <nb-action>
    <a routerLink="builds" routerLinkActive="active">
      <fa-icon [icon]="faLightbulb"></fa-icon>
      <span>Builds</span>
    </a>
  </nb-action>
  <nb-action *ngIf="!currentUser">
    <a routerLink="pricing" routerLinkActive="active">
      <fa-icon [icon]="faHandHoldingDollar"></fa-icon>
      <span>Pricing</span>
    </a>
  </nb-action>
  <nb-action *ngIf="!currentUser">
    <a routerLink="jobs" routerLinkActive="active">
      <fa-icon [icon]="faBriefcase"></fa-icon>
      <span>Jobs</span>
    </a>
  </nb-action>
