<div class="com-flex com-justify-between com-items-center com-gap-3 com-container com-max-w-screen-xl">
  <a [routerLink]="['/']">
    <!--
      Render both variants and let CSS decide based on [data-theme].
      This prevents SSR/client mismatches caused by theme being resolved only after bootstrap.
    -->
    <div class="navbar-logo logo-light">
      <img
        *appBreakpoints="'<=md'"
        alt="Commudle"
        class="com-d-block com-w-8 com-h-8 com-object-contain"
        src="{{ staticAssets.commudle_logo_72 }}"
        title="Commudle"
      />
      <img
        *appBreakpoints="'>md'"
        alt="Commudle"
        class="com-d-block com-w-auto com-h-8 com-object-contain"
        src="{{ staticAssets.commudle_logo_full }}"
        title="Commudle"
      />
    </div>

    <div class="navbar-logo logo-dark">
      <img
        *appBreakpoints="'<=md'"
        alt="Commudle"
        class="com-d-block com-w-8 com-h-8 com-object-contain"
        src="{{ staticAssets.commudle_logo_72 }}"
        title="Commudle"
      />
      <img
        *appBreakpoints="'>md'"
        alt="Commudle"
        class="com-d-block com-w-auto com-h-8 com-object-contain"
        src="{{ staticAssets.commudle_logo_dark_mode }}"
        title="Commudle"
      />
    </div>
  </a>

  <div class="home-navbar">
    <ng-container *ngIf="!currentUser; else searchBox">
      <div *appBreakpoints="'<=lg'" [routerLink]="['/search']" class="logged-out-search logged-out-search-guest">
        <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
      </div>
      <app-search-box
        *appBreakpoints="'>lg'"
        class="md:com-col-span-1 md:com-justify-self-start"
        shape="semi-round"
      ></app-search-box>
    </ng-container>
    <ng-template #searchBox>
      <div *appBreakpoints="'<=lg'" [routerLink]="['/search']" class="logged-out-search logged-out-search-user">
        <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
      </div>
      <app-search-box
        *appBreakpoints="'>lg'"
        class="com-col-span-4 md:com-col-span-1 md:com-justify-self-start"
        shape="semi-round"
      ></app-search-box>
    </ng-template>
    <ng-container *ngIf="currentUser">
      <div (click)="this.notificationCount = 0; gtmService()" *appBreakpoints="'<=md'">
        <a [routerLink]="['/notifications']" routerLinkActive="active" class="notification-link-mobile">
          <nb-badge *ngIf="notificationCount > 0" [text]="notificationCount.toString()" status="danger"></nb-badge>
          <fa-icon [icon]="faBell"></fa-icon>
        </a>
      </div>
    </ng-container>

    <app-navbar-menu *appBreakpoints="'>md'" class="com-justify-self-center navbar-menu-desktop"></app-navbar-menu>

    <div class="user-login">
      <div class="toggle-dark-mode">
        <button (click)="toggleDarkMode(true)" class="toggle-btn-moon theme-toggle-to-dark" nbButton>
          <fa-icon [icon]="faMoon"></fa-icon>
        </button>
        <button (click)="toggleDarkMode(false)" class="toggle-btn-sun theme-toggle-to-light !com-p-0" nbButton>
          <img src="https://json.commudle.com/icons/dark-mode-sun-icon.svg" />
        </button>
      </div>
      <div class="profile-container" *appBreakpoints="'>md'">
        <img
          *ngIf="currentUser; else guest"
          (click)="toggleDropdown($event)"
          [alt]="currentUser.name"
          [src]="currentUser.photo.i64"
          class="user-profile-image"
        />
        <commudle-navbar-user-context-menu
          *ngIf="currentUser && showUserContextMenu"
          [currentUser]="currentUser"
        ></commudle-navbar-user-context-menu>
        <ng-template #guest>
          <button (click)="login()" *appBreakpoints="'>lg'" nbButton outline size="small" class="profile">
            Login / Signup
          </button>
          <button
            (click)="login()"
            *appBreakpoints="'<=lg'"
            nbButton
            outline
            size="small"
            class="profile"
            title="Login / Signup"
          >
            <nb-icon icon="log-in-outline"></nb-icon>
          </button>
        </ng-template>
      </div>
    </div>
  </div>

  <div *appBreakpoints="'>lg'">
    <div *ngIf="showAdminSidebar" (click)="toggleSidebar()" class="home-sidebar">
      <fa-icon [icon]="faBars"></fa-icon>
    </div>
  </div>
  <div *appBreakpoints="'<=lg'">
    <div *ngIf="showAdminSidebar" (click)="toggleSidebar()" class="home-sidebar">
      <fa-icon [icon]="faBars"></fa-icon>
    </div>
    <button
      *ngIf="!currentUser"
      (click)="login()"
      nbButton
      size="small"
      status="info"
      shape="semi-round"
      class="profile signup-cta signup-cta-mobile"
    >
      Login
    </button>
  </div>
</div>
