<commudle-listing-pages-layout>
  <div header>
    <commudle-listing-page-header
      (seoPreviewImageRetrieved)="onSeoPreviewImageRetrieved($event)"
      [parentType]="'communities'"
    ></commudle-listing-page-header>
  </div>
  <div one-column *appBreakpoints="'<=lg'">
    <div class="publish-community-button">
      <a [routerLink]="['/pricing']" nbButton size="giant" class="button">
        <nb-icon icon="plus"></nb-icon>
        Start your community
      </a>
    </div>
    <commudle-communities-featured></commudle-communities-featured>
    <div class="hackathons-upcoming">
      <commudle-upcoming-hackathons></commudle-upcoming-hackathons>
    </div>
    <div class="speakers-upcoming">
      <commudle-public-home-list-speakers-upcoming></commudle-public-home-list-speakers-upcoming>
    </div>
    <div class="speakers">
      <commudle-public-home-list-events-speakers
        [parentType]="'communities'"
      ></commudle-public-home-list-events-speakers>
    </div>
    <commudle-communities-list (seoTitleChange)="onSeoTitleChange($event)"></commudle-communities-list>
    <div class="tech-sessions">
      <commudle-public-home-list-events-tech-sessions></commudle-public-home-list-events-tech-sessions>
    </div>
    <div class="speakers-content">
      <commudle-public-home-list-speakers-content
        [parentType]="'communities'"
      ></commudle-public-home-list-speakers-content>
    </div>
  </div>
  <div main-column *appBreakpoints="'>lg'">
    <commudle-communities-featured></commudle-communities-featured>
    <commudle-communities-list (seoTitleChange)="onSeoTitleChange($event)"></commudle-communities-list>
  </div>
  <div right-column>
    <div class="publish-community-button">
      <a [routerLink]="['/pricing']" target="_blank" nbButton size="giant" class="button">
        <nb-icon icon="plus"></nb-icon>
        Start your community
      </a>
    </div>
    <div class="hackathons-upcoming">
      <commudle-upcoming-hackathons></commudle-upcoming-hackathons>
    </div>
    <div class="speakers-upcoming">
      <commudle-public-home-list-speakers-upcoming></commudle-public-home-list-speakers-upcoming>
    </div>
    <div class="tech-sessions">
      <commudle-public-home-list-events-tech-sessions></commudle-public-home-list-events-tech-sessions>
    </div>
    <div class="speakers">
      <commudle-public-home-list-events-speakers
        [parentType]="'communities'"
      ></commudle-public-home-list-events-speakers>
    </div>
    <div class="speakers-content">
      <commudle-public-home-list-speakers-content
        [parentType]="'communities'"
      ></commudle-public-home-list-speakers-content>
    </div>
  </div>
</commudle-listing-pages-layout>
