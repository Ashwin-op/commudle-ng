<div *ngIf="communityBuild" class="build-container">
  <div class="base-layout community-build-container">
    <div class="container">
      <div *appBreakpoints="'>lg'" class="two-column-layout medium">
        <div class="main-column">
          <app-community-build-details [cBuild]="communityBuild"></app-community-build-details>
        </div>
        <div class="right-column">
          <div class="created-by-container">
            <h3>Created by</h3>
            <app-user-profile-card-large
              [showFollowButton]="true"
              [alignFollowToRight]="true"
              [appearanceOfFollowButton]="'outline'"
              [user]="communityBuild.user"
            ></app-user-profile-card-large>
            <ng-container *ngIf="communityBuild.user_roles_users.length > 0">
              <p class="fs-p1">Teammates</p>
              <div *ngFor="let teammate of communityBuild.user_roles_users">
                <app-user-profile-card-small
                  [user]="teammate.user"
                  class="com-block com-mt-2"
                ></app-user-profile-card-small>
              </div>
            </ng-container>
          </div>
          <commudle-show-more-builds
            [user]="communityBuild.user"
            [curBuild]="communityBuild"
          ></commudle-show-more-builds>
          <com-card class="updates" *ngIf="communityBuild.entity_updates.length > 0">
            <com-card-header>Updates</com-card-header>
            <com-card-body>
              <ul>
                <li *ngFor="let updates of communityBuild.entity_updates">
                  <div
                    [innerHTML]="updates.details | stripHtmlExceptLinks | safeHtml"
                    style="word-break: break-word; overflow-wrap: break-word"
                  ></div>
                  <span class="date">{{ moment(updates.created_at).format('dddd, MMM Do, YYYY') }}</span>
                </li>
              </ul>
            </com-card-body>
          </com-card>
        </div>
      </div>
      <div *appBreakpoints="'<=lg'" class="one-column-layout">
        <com-card class="created-by-card">
          <com-card-body class="created-container">
            <h3>Created by</h3>
            <app-user-profile-card-large
              [showFollowButton]="true"
              [alignFollowToRight]="true"
              [appearanceOfFollowButton]="'outline'"
              [user]="communityBuild.user"
            ></app-user-profile-card-large>
            <ng-container *ngIf="communityBuild.user_roles_users.length > 0">
              <p class="fs-p1">Teammates</p>
              <div *ngFor="let teammate of communityBuild.user_roles_users">
                <app-user-profile-card-small
                  [user]="teammate.user"
                  class="com-block com-mt-2"
                ></app-user-profile-card-small>
              </div>
            </ng-container>
          </com-card-body>
        </com-card>
        <app-community-build-details [cBuild]="communityBuild"></app-community-build-details>
        <commudle-show-more-builds [user]="communityBuild.user" [curBuild]="communityBuild"></commudle-show-more-builds>
      </div>
    </div>
  </div>
</div>
