<com-card id="{{ heading }}">
  <com-card-body>
    <div class="title">
      <div class="heading">
        <h3 class="section-heading-anchor">
          {{ heading }}
          <a
            [routerLink]="'.'"
            fragment="{{ heading | replaceSpace }}"
            class="anchor-link"
            aria-label="Link to Top Publishers section"
          >
            <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon
          ></a>
        </h3>
        <nb-icon icon="question-mark-circle-outline" nbTooltip="{{ toolTipText }}"></nb-icon>
      </div>
      <h4 class="sub-heading">{{ subHeading }}</h4>
    </div>
    <div class="tags">
      <div class="tag-list">
        <app-tag
          class="custom-tag"
          [tags]="[options[0]]"
          [inputSize]="'none'"
          [removable]="month"
          [backgroundColor]="'com-bg-tAnti-Flash'"
          [fontColor]="month ? 'com-text-Azure' : 'com-text-Dark-Jungle-Green'"
          (click)="filterByTags(options[0])"
        ></app-tag>

        <app-tag
          class="custom-tag"
          [tags]="[options[1]]"
          [inputSize]="'none'"
          [removable]="year"
          [backgroundColor]="'com-bg-tAnti-Flash'"
          [fontColor]="year ? 'com-text-Azure' : 'com-text-Dark-Jungle-Green'"
          (click)="filterByTags(options[1])"
        ></app-tag>

        <app-tag
          class="custom-tag"
          [tags]="[options[2]]"
          [inputSize]="'none'"
          [removable]="allTime"
          [backgroundColor]="'com-bg-tAnti-Flash'"
          [fontColor]="allTime ? 'com-text-Azure' : 'com-text-Dark-Jungle-Green'"
          (click)="filterByTags(options[2])"
        ></app-tag>
      </div>
    </div>
    <app-skeleton-cards
      [cards]="4"
      [ImageShapeSquare]="true"
      [ImageShapeCircle]="false"
      *ngIf="showSkeletonCard"
    ></app-skeleton-cards>
    <div class="top-builders custom-scrollbar">
      <div class="top-builders-card" *ngFor="let topBuilder of topBuilders">
        <div *appBreakpoints="'>lg'">
          <commudle-top-builders-card
            [topBuilder]="topBuilder"
            [displayVotes]="true"
            [allignFollowButtonToRight]="true"
            [displayDesignation]="true"
            [maxUserNameLength]="10"
          ></commudle-top-builders-card>
        </div>
        <div *appBreakpoints="'<=lg'">
          <commudle-top-builders-card
            [topBuilder]="topBuilder"
            [displayVotes]="true"
            [showFollowButton]="true"
            [displayDesignation]="true"
            [maxUserNameLength]="10"
          ></commudle-top-builders-card>
        </div>
      </div>
      <app-loading-spinner *ngIf="showSpinner"></app-loading-spinner>
      <div class="load-more">
        <button
          *ngIf="canLoadMore && total && !showSpinner && parentType === 'builds'"
          (click)="getCommunityBuilds(); showSpinner = true"
          nbButton
          outline
          size="tiny"
          status="info"
          [disabled]="!canLoadMore || isLoading"
        >
          Load More
        </button>
        <button
          *ngIf="canLoadMore && total && !showSpinner && parentType === 'labs'"
          (click)="getLabs(); showSpinner = true"
          nbButton
          outline
          size="tiny"
          status="info"
          [disabled]="!canLoadMore || isLoading"
        >
          Load More
        </button>
      </div>
    </div>
  </com-card-body>
</com-card>
