<div class="builds" id="latest-builds">
  <div class="heading-filter">
    <div class="header-text">
      <h3 class="title">
        <a [routerLink]="'.'" fragment="latest-builds">Latest Builds</a>
        <commudle-help-section [helpDictionaryName]="'build-help'"></commudle-help-section>
      </h3>
      <h4 class="sub-heading">Explore latest projects and get inspired</h4>
    </div>
    <app-tag
      *ngIf="selectedTags.length > 0"
      [tags]="selectedTags"
      [backgroundColor]="'com-bg-[#FCEDE7]'"
      [size]="'tiny'"
      [fontColor]="'com-text-[#C05324]'"
    ></app-tag>
    <div class="filters">
      <button
        nbButton
        [status]="isAllFilterSelected ? 'primary' : 'basic'"
        [ngStyle]="{ color: isAllFilterSelected ? 'white' : 'black' }"
        class="all-filter-button"
        shape="round"
        size="tiny"
        (click)="allFilterSelected()"
      >
        All
      </button>
      <nb-select
        placeholder="Most Popular"
        size="small"
        shape="round"
        class="most-popular-filter"
        [(ngModel)]="timePeriod"
        (selectedChange)="filter()"
        filled
        [status]="month || year || allTime ? 'primary' : 'basic'"
        [ngStyle]="{ color: isAllFilterSelected ? 'black' : 'white' }"
      >
        <nb-option *ngIf="!isCampaignMode" value="month"> Highest upvoted this month</nb-option>
        <nb-option *ngIf="!isCampaignMode" value="year">Highest upvoted this year</nb-option>
        <nb-option value="all-time">Highest upvoted all time</nb-option>
      </nb-select>
      <button
        *ngIf="isCampaignMode"
        nbButton
        size="tiny"
        (click)="clearCampaignFilters()"
        aria-label="Clear campaign filters"
        shape="round"
        [status]="'basic'"
        class="clear-campaign-filter"
        title="Clear campaign filters"
      >
        Clear filter
      </button>
    </div>
  </div>
  <app-skeleton-cards
    [cards]="10"
    [ImageShapeSquare]="true"
    [ImageShapeCircle]="false"
    *ngIf="skeletonLoaderCard"
  ></app-skeleton-cards>
  <div
    *appBreakpoints="'>lg'"
    (scrolled)="getCommunityBuilds()"
    [infiniteScrollDisabled]="communityBuilds.length >= total"
    appInfiniteScroll
  >
    <div *ngFor="let communityBuild of communityBuilds" class="builds-card">
      <app-community-build-card [communityBuild]="communityBuild"></app-community-build-card>
    </div>
    <app-loading-spinner *ngIf="loading" class="com-mt-4"></app-loading-spinner>
  </div>
  <div *appBreakpoints="'<=lg'">
    <div *ngFor="let communityBuild of communityBuilds" class="builds-card">
      <app-community-build-card [communityBuild]="communityBuild"></app-community-build-card>
    </div>
    <app-loading-spinner *ngIf="loading" class="com-mt-4"></app-loading-spinner>
    <button
      (click)="getCommunityBuilds()"
      *ngIf="page_info?.has_next_page"
      fullWidth
      ghost
      nbButton
      class="view-more-button"
    >
      View More
    </button>
  </div>
</div>
