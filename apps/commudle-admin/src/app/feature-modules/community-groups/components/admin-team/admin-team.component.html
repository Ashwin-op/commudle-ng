<com-card class="admin-team-page" *ngIf="communityGroup">
  <com-card-body>
    <!-- Header -->
    <header class="page-header">
      <div class="header-info">
        <h1 class="page-title">
          <nb-icon icon="shield-outline"></nb-icon>
          Admin Team
        </h1>
      </div>
    </header>

    <!-- Invite form -->
    <div class="invite-section">
      <form (ngSubmit)="inviteCommunityAdmin()" [formGroup]="userRolesUserForm" class="invite-form">
        <label class="invite-label">Add a Teammate</label>
        <div class="invite-controls">
          <input fieldSize="small" formControlName="email" nbInput placeholder="Enter Email" type="email" />
          <button
            [disabled]="!userRolesUserForm.valid"
            comButton
            status="primary"
            size="small"
            shape="semi-round"
            type="submit"
          >
            Send Invitation
          </button>
        </div>
      </form>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-state">
      <app-skeleton-cards [displayFollowButton]="true" [cards]="5"></app-skeleton-cards>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && team.length === 0" class="empty-state">
      <div class="empty-icon"><nb-icon icon="shield-outline"></nb-icon></div>
      <h3 class="empty-title">No team members yet</h3>
      <p class="empty-desc">Invite administrators to help manage this organization.</p>
    </div>

    <!-- Team list -->
    <div class="team-list" *ngIf="!isLoading && team.length > 0">
      <div class="team-member" *ngFor="let member of team; let i = index">
        <app-user-profile-horizontal [user]="member.user" [socialMediaLinks]="true"></app-user-profile-horizontal>
        <div class="member-actions">
          <a
            *ngIf="member.status === EUserRolesUserStatus.INVITED"
            (click)="resendInvitationMail(member)"
            class="action-link resend"
          >
            Resend Invite
          </a>
          <a (click)="openRemoveConfirmation(i, removeConfirmationDialog)" class="action-link remove">Remove</a>
        </div>
      </div>
    </div>
  </com-card-body>
</com-card>

<ng-template #removeConfirmationDialog let-ref="dialogRef" let-context>
  <com-card class="remove-dialog">
    <com-card-header class="remove-dialog-header">
      <span>Remove Team Member</span>
      <button (click)="ref.close()" ghost nbButton size="small" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <p class="remove-dialog-text">
        Are you sure you want to remove <strong>{{ team[context.index]?.user?.name }}</strong> from the admin team?
      </p>
    </com-card-body>
    <com-card-footer class="remove-dialog-footer">
      <button (click)="ref.close()" nbButton outline status="basic" size="small">Cancel</button>
      <button (click)="remove(context.index, ref)" nbButton status="danger" size="small">Remove</button>
    </com-card-footer>
  </com-card>
</ng-template>
