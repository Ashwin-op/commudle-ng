<section class="com-flex md:com-hidden community-mobile-header">
  <button *ngIf="isMobileView" nbButton ghost size="small" (click)="toggleSidebar()" class="toggle-sidebar-btn">
    <fa-icon [icon]="icons.faRightLeft"></fa-icon>
  </button>
  <div class="community-logo-mobile" *ngIf="communityGroup">
    <img [src]="logoUrl" [alt]="communityGroup.name" />
    <span>{{ communityGroup.name }}</span>
  </div>
</section>

<section class="com-flex">
  <!-- Sidebar (desktop: sticky, mobile: overlay window) -->
  <div class="sidebar">
    <commudle-sidebar
      [expandedWidth]="sidebarExpanded ? ESidebarWidth.XL : ESidebarWidth.XSMALL"
      [forWindow]="isMobileView"
      [showExpandedButton]="!isMobileView || sidebarExpanded"
      [eventName]="sidebarEventName"
      [heading]="'Org Dashboard'"
      [textSize]="ESidebarHeading.MEDIUM"
    >
      <div class="action-buttons" (click)="closeSidebarOnMobile()">
        <div class="category">
          <a
            class="action-button"
            [routerLink]="['./']"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <div class="icon"><nb-icon icon="grid-outline"></nb-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Overview</span>
          </a>
          <a class="action-button" [routerLink]="['communities']" routerLinkActive="active">
            <div class="icon"><nb-icon icon="info-outline"></nb-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Communities</span>
          </a>
          <a
            class="action-button"
            [ngClass]="{ 'sub-item': sidebarExpanded }"
            [routerLink]="['events']"
            routerLinkActive="active"
          >
            <div class="icon"><nb-icon icon="calendar-outline"></nb-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Events</span>
          </a>
          <a
            class="action-button"
            [ngClass]="{ 'sub-item': sidebarExpanded }"
            [routerLink]="['hackathons']"
            routerLinkActive="active"
          >
            <div class="icon"><fa-icon [icon]="icons.faTrophy"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Hackathons</span>
          </a>
          <a class="action-button" [routerLink]="['members']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faUsers"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">All Members</span>
          </a>
          <a class="action-button" [routerLink]="['admin-team']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faUserGroup"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Admin Team</span>
          </a>
          <a class="action-button" [routerLink]="['edit']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faPen"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Edit Details</span>
          </a>
          <a class="action-button" [routerLink]="['surveys']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faScroll"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Surveys</span>
          </a>
          <a class="action-button" [routerLink]="['pages']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faHouse"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Pages</span>
          </a>
          <a class="action-button" [routerLink]="['channels']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faHashtag"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Channels</span>
          </a>
          <a class="action-button" [routerLink]="['forums']" routerLinkActive="active">
            <div class="icon"><fa-icon [icon]="icons.faMessage"></fa-icon></div>
            <span *ngIf="sidebarExpanded" class="heading">Forums</span>
          </a>
        </div>
      </div>

      <!-- Community identity footer -->
      <div sidebarFooter class="community-identity" *ngIf="communityGroup && !isMobileView">
        <div class="community-logo">
          <img [src]="logoUrl" [alt]="communityGroup.name" />
        </div>
        <div *ngIf="sidebarExpanded" class="community-info">
          <span class="community-name">{{ communityGroup.name }}</span>
          <app-subscription-plan-badge
            [subscriptionId]="groupSubscriptionId"
            [kommunitiesCount]="communityGroup.kommunities_count"
            [communityCountLimit]="communityGroup.community_count_limit"
          ></app-subscription-plan-badge>
        </div>
      </div>
    </commudle-sidebar>
  </div>

  <!-- Router outlet -->
  <div class="right-column">
    <div class="router">
      <router-outlet></router-outlet>
    </div>
  </div>
</section>
