<com-card class="collaborations">
  <com-card-header>
    <h6>
      <nb-icon icon="pricetags-outline"></nb-icon>
      Collaborations
      <commudle-help-section [helpDictionaryName]="'event-collaborations'"></commudle-help-section>
    </h6>
  </com-card-header>
  <com-card-body>
    <div>
      <div *ngIf="collaborationCommunities.length > 0">
        <commudle-alert
          [info]="true"
          message="In case your collaboration request email was missed by the organizers of the community, they can also accept the request from the notifications in their community dashboard"
        ></commudle-alert>
        <br />
      </div>
      <div class="collaboration-communities">
        <div *ngFor="let col of collaborationCommunities; let i = index" class="community">
          <div class="logo">
            <a [routerLink]="['/communities', col.community.slug]">
              <img
                alt="{{ col.community.name }}"
                src="{{ col.community.logo_image_path.i64 }}"
                title="{{ col.community.name }}"
              />
            </a>
          </div>
          <div class="details">
            <p>{{ col.community.name | slice : 0 : 10 }}</p>
            <div *ngIf="event.editable" class="actions">
              <!-- <a (click)="resendConfirmationEmail(col.id)" *ngIf="!col.approved" class="clickable">
                <small> Resend Request </small>
              </a> -->
              <a
                [ngClass]="{ disabled: col.status && col.status === EEventCollaborationCommunityStatus.REJECTED }"
                (click)="removeCollaboration(col.id, i)"
                class="clickable"
              >
                <small> Remove </small>
              </a>
              <small *ngIf="col.status === EEventCollaborationCommunityStatus.REJECTED" class="rejected">
                REJECTED
              </small>
            </div>
          </div>
        </div>
        <div *ngIf="event.editable">
          <label>
            <p>
              <fa-icon [icon]="faInfoCircle"></fa-icon>
              Type 3 or more characters to get the results
            </p>

            <input
              #autoInput
              (input)="onChange()"
              (keyup)="checkTyping()"
              [nbAutocomplete]="auto"
              [value]="selectedCommunity"
              nbInput
              placeholder="Enter Name..."
              type="text"
            />
          </label>

          <nb-autocomplete #auto (selectedChange)="onSelectionChange($event)">
            <nb-option *ngFor="let community of communities" [value]="community">
              <div class="logo">
                <img
                  alt="{{ community.name }}"
                  src="{{ community.logo_image_path.i64 }}"
                  title="{{ community.name }}"
                />
              </div>
              {{ community.name }}
            </nb-option>
            <nb-option *ngIf="communities.length === 0 && typing" disabled>No Results</nb-option>
          </nb-autocomplete>
        </div>
      </div>
    </div>
  </com-card-body>
</com-card>

<commudle-sponsors [event]="event"></commudle-sponsors>

<ng-template #collaborationConfirmation let-data let-ref="dialogRef">
  <com-card class="confirmation-dialog-box">
    <com-card-header>
      <div>Are You Sure?</div>
      <button ghost nbButton size="small" (click)="ref.close()" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <div>
        We advise you to connect with the community leaders over chat on their community or Commudle profile before or
        after you send the invite so that they don’t miss it.
      </div>
    </com-card-body>
    <com-card-footer>
      <button nbButton status="primary" (click)="createCollaboration(data.communityId); ref.close()">Send</button>&nbsp;
      <button nbButton status="danger" (click)="ref.close()">cancel</button>
    </com-card-footer>
  </com-card>
</ng-template>
