<com-card *ngIf="speakers?.length > 0" class="manual-speakers">
  <com-card-header>Manually added speakers</com-card-header>
  <com-card-body>
    <div *ngFor="let speaker of speakers" class="speaker-row" [class.cancelled]="isCancelled(speaker)">
      <img *ngIf="speaker.user?.photo?.i64" [src]="speaker.user.photo.i64" alt="" class="speaker-photo" />
      <div class="speaker-info">
        <p class="speaker-name">
          {{ speaker.user?.name }}
          <span *ngIf="isCancelled(speaker)" class="cancelled-tag">Cancelled</span>
        </p>
        <p *ngIf="speaker.user?.designation" class="speaker-designation">{{ speaker.user.designation }}</p>
        <p class="speaker-pass">
          Entry pass code:
          <strong *ngIf="speaker.entry_pass?.unique_code; else noPass">{{ speaker.entry_pass.unique_code }}</strong>
          <ng-template #noPass><span class="com-text-gray-500">not generated yet</span></ng-template>
        </p>
      </div>
      <div class="speaker-actions">
        <button
          (click)="openEntryPassEmailWindow(speaker)"
          [disabled]="isCancelled(speaker)"
          nbButton
          size="small"
          outline
          status="primary"
          type="button"
        >
          <fa-icon [icon]="icons.faEnvelope"></fa-icon>
          {{ speaker.entry_pass ? 'Resend entry pass' : 'Send entry pass' }}
        </button>
        <button
          (click)="editSpeaker.emit(speaker)"
          [disabled]="isCancelled(speaker)"
          nbButton
          size="small"
          outline
          type="button"
        >
          <fa-icon [icon]="icons.faPen"></fa-icon> Edit
        </button>
        <button
          (click)="confirmCancel(speaker)"
          [disabled]="isCancelled(speaker)"
          nbButton
          size="small"
          status="danger"
          outline
          type="button"
        >
          Cancel
        </button>
      </div>
    </div>
  </com-card-body>
</com-card>

<ng-template #cancelDialogTemplate let-data let-ref="dialogRef">
  <com-card class="cancel-dialog">
    <com-card-header class="actions">
      <span>Cancel this speaker?</span>
      <button (click)="ref.close()" ghost nbButton shape="round" size="small" type="button">
        <fa-icon [icon]="icons.faXmark"></fa-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <p>{{ data.speaker.user?.name }} will be marked as cancelled. This does not delete the speaker's profile.</p>
    </com-card-body>
    <com-card-footer class="actions">
      <button (click)="cancelSpeaker(data.speaker)" [disabled]="isCancelling" nbButton status="danger" type="button">
        Cancel speaker
      </button>
      <button (click)="ref.close()" nbButton status="basic" outline type="button">Keep</button>
    </com-card-footer>
  </com-card>
</ng-template>
