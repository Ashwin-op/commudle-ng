<com-card class="discount-coupon-dialog">
  <com-card-header>
    <div class="dialog-header">
      <div>{{ type | titlecase }} Discount Coupon</div>

      <button (click)="this.closeDialogBox(); discountCouponForm.reset()" ghost nbButton shape="round" size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </div>
  </com-card-header>
  <com-card-body>
    <form [formGroup]="discountCouponForm">
      <div formGroupName="discount_code" class="com-flex com-flex-col com-gap-3">
        <!-- Name -->
        <label>
          Code*
          <input
            formControlName="code"
            fullWidth
            nbInput
            type="text"
            placeholder="Coupon Name"
            (input)="onCodeInput($event)"
          />
        </label>

        <div class="com-flex com-gap-2">
          <!-- Discount type* -->
          <label>
            Discount type*
            <div class="select !com-mt-0">
              <select
                formControlName="discount_type"
                [ngClass]="{
                  'com-text-[#8E9BB3]': discountCouponForm.controls.discount_code.get('discount_type').value === ''
                }"
              >
                <option value="" selected disabled>Select Discount Type</option>
                <option value="percent">Percent</option>
                <option value="fixed_amount">Value</option>
              </select>
            </div>
          </label>
          <!-- Discount value* -->
          <label>
            Discount value*
            <input formControlName="discount_value" fullWidth nbInput type="number" placeholder=" Discount value" />
          </label>
        </div>
        <commudle-alert
          [error]="discountCouponForm.controls.discount_code.get('discount_value').hasError('min')"
          errorMessage="Value can't be less than 1"
        >
        </commudle-alert>
        <commudle-alert
          [error]="discountCouponForm.controls.discount_code.get('discount_value').hasError('discount_value_exceeds')"
          errorMessage="Value can't be greater than 100"
        >
        </commudle-alert>

        <commudle-alert
          message="Min Users Count and Max Users Count is the min and max number of people in a group ticket on which the discount code can be applied."
          [info]="true"
        ></commudle-alert>

        <div class="com-flex com-gap-2">
          <!-- min_users_count -->
          <label>
            Min users count
            <input
              formControlName="min_users_count"
              nbInput
              fullWidth
              type="number"
              placeholder="Leave empty if not applicable"
              min="1"
            />
          </label>

          <!-- max_users_count -->
          <label>
            Max users count
            <input
              formControlName="max_users_count"
              nbInput
              fullWidth
              type="number"
              placeholder="Leave empty if not applicable"
              min="1"
            />
          </label>
        </div>

        <!-- Is Limited* -->
        <label class="com-col-span-1 com-flex com-items-center com-gap-2">
          <input formControlName="is_limited" type="checkbox" (change)="updateMaxApplicationCount()" />
          <span class="com-text-primary-500 com-font-medium">Coupon Application Limit</span>
        </label>
        <!-- Max Limit* -->
        <div *ngIf="discountCouponForm.controls.discount_code.get('is_limited').value === true">
          <commudle-alert
            message="This is the total number of individual ticket holders for which the discount code can be applied."
            [info]="true"
          ></commudle-alert>
          <label class="com-col-span-1">
            Max application limit count*
            <input formControlName="max_limit" nbInput fullWidth type="number" placeholder="Max Limit" />
          </label>
        </div>
        <!-- Expires At* -->
        <label class="com-col-span-1">
          <div>
            <span> Expires At </span>
            <span
              *ngIf="discountCouponForm.controls.discount_code.get('expires_at').value"
              class="com-p-1 com-text-xs com-cursor-pointer com-text-primary-500"
              (click)="clearExpiresAt(); $event.stopPropagation()"
              >Clear</span
            >
          </div>
          <input formControlName="expires_at" fullWidth nbInput type="datetime-local" />
        </label>

        <!-- Event Data Form Entity Group Ids* -->
        <div>
          <label class="com-col-span-1 com-my-4"> Select the form in which you want to apply coupon* </label>
          <br />
          <div class="com-grid com-gap-3 com-grid-cols-2">
            <label
              *ngFor="let edfeg of eventDataFormEntityGroups; let i = index"
              class="com-flex com-items-center com-gap-2"
            >
              <input
                type="checkbox"
                [checked]="type === 'edit' ? selectedEventDataFormEntityGroups.includes(edfeg.id) : edfeg.is_paid"
                [value]="edfeg.id"
                (change)="addEventDataForm($event)"
              />
              <span class="com-text-primary-500 com-font-semibold"> {{ edfeg.name }} </span>
            </label>
          </div>
        </div>
      </div>
    </form>
  </com-card-body>
  <com-card-footer>
    <div class="dialog-actions">
      <button
        nbButton
        status="primary"
        (click)="type === 'edit' ? savedDiscountCouponData(discountCode.id) : savedDiscountCouponData()"
        [disabled]="!discountCouponForm.valid || selectedEventDataFormEntityGroups.length === 0"
      >
        {{ type === 'edit' ? 'Update' : type }}
      </button>
      <button nbButton status="danger" outline (click)="this.closeDialogBox(); discountCouponForm.reset()">
        Cancel
      </button>
    </div>
  </com-card-footer>
</com-card>
