<nb-card class="sponsors">
  <nb-card-header>
    <h6>
      <nb-icon icon="briefcase-outline"></nb-icon> &nbsp; Sponsors
      <commudle-help-section [helpDictionaryName]="'event-sponsors'"></commudle-help-section>
    </h6>
  </nb-card-header>
  <nb-card-body>
    <button (click)="openForm(addSponsorDialogBox)" *ngIf="event.editable" nbButton status="primary">
      <nb-icon icon="plus"></nb-icon> &nbsp; <span>Add Sponsor</span>
    </button>
    <div class="sponsors">
      <div
        *ngFor="let eventSponsorsGrouped of eventSponsorGroupedByTierName | keyvalue"
        class="sponsors-cards-container"
      >
        <h6>{{ eventSponsorsGrouped.key }}</h6>
        <div class="event-sponsors">
          <div *ngFor="let eventSponsor of eventSponsorsGrouped.value; let i = index" class="event-sponsor">
            <div class="logo">
              <img
                *ngIf="eventSponsor.sponsor.logo"
                [alt]="eventSponsor.sponsor.name"
                [src]="eventSponsor.sponsor.logo.url"
                [title]="eventSponsor.sponsor.name"
              />
            </div>
            <div class="details">
              <div class="name-link">
                <h3 class="name">{{ eventSponsor.sponsor.name }}</h3>
                <p *ngIf="eventSponsor.description" class="description">
                  {{ eventSponsor.description }}
                </p>
                <a [href]="eventSponsor.sponsor.link" target="_blank">{{ eventSponsor.sponsor.link }}</a>
              </div>
              <a
                (click)="openConfirmDeleteDialog(removeSponsorTemplate, eventSponsor, eventSponsorsGrouped.key, i)"
                *ngIf="event.editable"
                class="remove-sponsor-button clickable"
              >
                <nb-icon icon="close-circle-outline" status="danger"></nb-icon>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<ng-template #addSponsorDialogBox let-ref="dialogRef">
  <nb-card class="add-sponsor-container">
    <nb-card-header class="actions">
      <span>Add a sponsor</span>
      <button ghost nbButton size="small" shape="round" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <app-loading-spinner *ngIf="loadingExistingSponsors"></app-loading-spinner>
      <form [formGroup]="sponsorForm" class="sponsor-form sponsor-form-dialog-box">
        <div class="sponsor-select">
          <label for="sponsor_selection">Select Sponsor*</label>
          <div class="dropdown">
            <select
              id="sponsor_selection"
              formControlName="sponsor_selection"
              (change)="onSponsorSelectionChange()"
              [ngClass]="{
                'com-text-[#8E9BB3]': sponsorForm.get('sponsor_selection')?.value === null
              }"
            >
              <option [ngValue]="null" disabled>Select Sponsor</option>
              <option [ngValue]="sponsorSelectionNew">Add New</option>
              <option *ngIf="existingSponsors.length > 0" disabled>Choose From existing sponsors</option>
              <option *ngFor="let sponsor of existingSponsors" [ngValue]="sponsor.id">{{ sponsor.name }}</option>
            </select>
          </div>
          <commudle-alert
            *ngIf="
              sponsorForm.controls['sponsor_selection'].touched &&
              sponsorForm.controls['sponsor_selection'].invalid &&
              sponsorForm.controls['sponsor_selection'].hasError('required')
            "
            [error]="true"
            errorMessage="Please select a sponsor"
          ></commudle-alert>
        </div>

        <div>
          <label for="tier_name">Tier Name*</label>
          <input placeholder="Tier name" nbInput fullWidth formControlName="tier_name" type="text" />
          <commudle-alert
            *ngIf="
              sponsorForm.controls['tier_name'].touched &&
              sponsorForm.controls['tier_name'].invalid &&
              sponsorForm.controls['tier_name'].hasError('required')
            "
            [error]="true"
            errorMessage="Tier name is required"
          ></commudle-alert>
        </div>

        <div>
          <label for="tier_priority">Tier Priority*</label>
          <br />
          <div class="select">
            <select name="tier_priority" formControlName="tier_priority">
              <option [value]="1">1 (Highest)</option>
              <option [value]="2">2</option>
              <option [value]="3">3</option>
              <option [value]="4">4</option>
              <option [value]="5">5 (Lowest)</option>
            </select>
          </div>
          <commudle-alert
            *ngIf="
              sponsorForm.controls['tier_priority'].touched &&
              sponsorForm.controls['tier_priority'].invalid &&
              sponsorForm.controls['tier_priority'].hasError('required')
            "
            [error]="true"
            errorMessage="Tier Priority is required"
          ></commudle-alert>
        </div>

        <div>
          <label for="name">Sponsor Name*</label>
          <input
            placeholder="Name"
            nbInput
            fullWidth
            formControlName="name"
            type="text"
            [readonly]="sponsorForm.get('sponsor_selection')?.value !== sponsorSelectionNew"
          />
          <commudle-alert
            *ngIf="
              sponsorForm.controls['name'].touched &&
              sponsorForm.controls['name'].invalid &&
              sponsorForm.controls['name'].hasError('required')
            "
            [error]="true"
            errorMessage="Name is required"
          ></commudle-alert>
        </div>

        <div>
          <label for="description">Description</label>
          <textarea
            name="description"
            fullWidth
            nbInput
            id="description"
            rows="2"
            placeholder="Description"
            formControlName="description"
          ></textarea>
        </div>

        <div>
          <label for="logo">Logo*</label>
          <div
            class="com-w-full"
            *ngIf="
              !(imagePreview || sponsorForm.controls['logo'].value) &&
              sponsorForm.get('sponsor_selection')?.value === sponsorSelectionNew
            "
          >
            <div
              class="com-border com-rounded-lg com-border-dashed com-bg-[#E4E9F2]/40 com-border-gray-500 com-relative"
            >
              <input
                (change)="onFileChange($event)"
                type="file"
                accept="image/*"
                class="com-cursor-pointer com-relative com-block com-opacity-0 com-w-full com-h-full com-p-16 com-z-50"
              />
              <div class="com-text-center com-absolute com-top-8 com-right-0 com-left-0 com-m-auto com-text-gray-400">
                <fa-icon [icon]="icons.faImage" class="com-text-5xl"></fa-icon>
                <p>
                  Drag file here
                  <br />
                  or<span class="com-text-primary-500"> BROWSE </span>
                </p>
              </div>
            </div>
          </div>
          <div *ngIf="imagePreview || sponsorForm.controls['logo'].value" class="image-preview">
            <div
              *ngIf="sponsorForm.get('sponsor_selection')?.value === sponsorSelectionNew"
              (click)="removeBannerImage()"
              class="delete-image"
            >
              <button nbButton status="danger" outline size="small" type="button">Delete</button>
            </div>
            <div class="com-w-56 com-h-56 com-mx-auto">
              <img
                class="com-w-full com-h-full com-object-contain"
                [src]="imagePreview || sponsorForm.controls['logo'].value"
                alt=""
              />
            </div>
          </div>
          <commudle-alert
            *ngIf="
              sponsorForm.get('sponsor_selection')?.value === sponsorSelectionNew &&
              sponsorForm.controls['logo'].touched &&
              sponsorForm.controls['logo'].invalid &&
              sponsorForm.controls['logo'].hasError('required')
            "
            [error]="true"
            errorMessage="Logo is required"
          ></commudle-alert>
        </div>

        <div>
          <label for="link">Website</label>
          <input placeholder="Website" nbInput fullWidth formControlName="link" type="text" />
          <commudle-alert
            *ngIf="sponsorForm.get('link').hasError('invalidUrl')"
            [error]="true"
            errorMessage="Enter complete URL"
          ></commudle-alert>
        </div>

        <div class="actions">
          <button nbButton status="primary" type="button" (click)="createSponsor()" [disabled]="sponsorForm.invalid">
            Save
          </button>
          <button nbButton status="danger" outline type="button" (click)="ref.close()">Cancel</button>
        </div>
      </form>
    </nb-card-body>
  </nb-card>
</ng-template>

<ng-template #removeSponsorTemplate let-ref="dialogRef" let-data>
  <nb-card class="remove-sponsor-confirmation">
    <nb-card-header>
      <div>Remove Sponsor</div>
      <button ghost nbButton size="small" shape="round" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body> Are you sure you want to remove this sponsor? </nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="removeSponsor(data.sponsor_id, data.index); ref.close()">Remove</button>
      <button nbButton status="primary" (click)="ref.close()">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
