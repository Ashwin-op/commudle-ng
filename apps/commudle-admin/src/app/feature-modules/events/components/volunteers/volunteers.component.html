<div class="volunteers-container">
  <div class="team-header">
    <div class="team-header-text">
      <h4 class="team-title">
        Team
        <commudle-help-section [helpDictionaryName]="'event-volunteer'"></commudle-help-section>
      </h4>
      <div class="info">
        <commudle-alert
          [info]="true"
          [message]="'Add teammates who can access the attendance page (applicable only for offline events)'"
        ></commudle-alert>
      </div>
    </div>
    <div *ngIf="event.editable" class="team-header-actions">
      <button comButton status="primary" size="small" (click)="showAddForm = !showAddForm">
        <nb-icon icon="plus-outline"></nb-icon>
        Add Teammate
      </button>
    </div>
  </div>

  <div *ngIf="showAddForm && event.editable" class="add-teammate-form">
    <form [formGroup]="userRolesUserForm" (ngSubmit)="createUserRolesUser()">
      <div class="form-fields-row">
        <div class="form-field">
          <label class="form-label">Email <span class="form-required">*</span></label>
          <input
            #emailInput
            formControlName="email"
            nbInput
            fieldSize="small"
            fullWidth
            placeholder="Enter Teammate Email"
            type="email"
          />
          <commudle-alert
            *ngIf="
              userRolesUserForm['controls'].email.touched &&
              userRolesUserForm['controls'].email.invalid &&
              userRolesUserForm['controls'].email.errors.required
            "
            [error]="true"
            [errorMessage]="'Required Field'"
          ></commudle-alert>
        </div>
        <div class="form-field">
          <label class="form-label">Designation <span class="form-required">*</span></label>
          <input
            formControlName="role_designation"
            nbInput
            fieldSize="small"
            fullWidth
            placeholder="Enter Designation"
            type="text"
            [nbAutocomplete]="autoComplete"
          />
          <commudle-alert
            *ngIf="
              userRolesUserForm['controls'].role_designation.touched &&
              userRolesUserForm['controls'].role_designation.invalid &&
              userRolesUserForm['controls'].role_designation.errors.required
            "
            [error]="true"
            [errorMessage]="'Required Field'"
          ></commudle-alert>
        </div>
        <div class="form-field-submit">
          <button [disabled]="!userRolesUserForm.valid" type="submit" nbButton status="primary" size="small" outline>
            Send Invite
          </button>
        </div>
      </div>
      <nb-autocomplete #autoComplete>
        <nb-option *ngFor="let roleDesignation of roleDesignations | async" [value]="roleDesignation">{{
          roleDesignation
        }}</nb-option>
      </nb-autocomplete>
    </form>
  </div>

  <app-loading-spinner *ngIf="loadingVolunteers"></app-loading-spinner>

  <div *ngIf="volunteers.length > 0" class="team-section">
    <div class="team-section-header">
      <h6 class="team-section-title">Team Members</h6>
      <span class="team-section-count">{{ volunteers.length }} Members</span>
    </div>

    <div class="team-table">
      <div class="team-table-header">
        <span class="team-table-col-member">MEMBER</span>
        <span class="team-table-col-role">DESIGNATION</span>
        <span class="team-table-col-actions">ACTIONS</span>
      </div>

      <div *ngFor="let volunteer of volunteers; let i = index" class="team-table-row">
        <div class="team-table-col-member">
          <app-user-profile-card-medium [user]="volunteer.user"></app-user-profile-card-medium>
        </div>
        <div class="team-table-col-role">
          <span class="role-badge">{{ volunteer.role_designation }}</span>
        </div>
        <div class="team-table-col-actions">
          <a
            *ngIf="volunteer.status === EUserRolesUserStatus.INVITED"
            class="action-link"
            (click)="resendInvitationMail(volunteer)"
          >
            Resend
          </a>
          <a class="action-link action-link--danger" (click)="remove(volunteer, i)"> Remove </a>
        </div>
      </div>
    </div>
  </div>
</div>
