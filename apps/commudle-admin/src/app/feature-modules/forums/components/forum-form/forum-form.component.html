<nb-card class="ff-dialog">
  <nb-card-header class="ff-header">
    <div class="ff-header-content">
      <div class="ff-header-icon">
        <fa-icon [icon]="forumId ? icons.faPen : icons.faCirclePlus"></fa-icon>
      </div>
      <div>
        <h4 class="ff-title">{{ forumId ? 'Edit Topic' : 'New Topic' }}</h4>
        <p class="ff-subtitle">{{ forumId ? 'Update the topic details below' : 'Create a new discussion topic' }}</p>
      </div>
    </div>
    <button comButton ghost size="small" shape="round" (click)="closeForm()">
      <fa-icon [icon]="icons.faXmark"></fa-icon>
    </button>
  </nb-card-header>

  <nb-card-body class="ff-body">
    <form [formGroup]="topicForm" class="ff-form">
      <!-- ── Topic Name ── -->
      <div class="ff-field">
        <label class="ff-label">Topic Name <span class="ff-required">*</span></label>
        <input nbInput fullWidth formControlName="name" placeholder="e.g. Getting started with Angular" type="text" />
        <span class="ff-hint">{{ topicForm.get('name')?.value?.length || 0 }} / 120</span>
        <commudle-alert
          *ngIf="topicForm.get('name')?.touched && topicForm.get('name')?.errors?.['required']"
          [error]="true"
          errorMessage="Topic name is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="topicForm.get('name')?.touched && topicForm.get('name')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Cannot exceed 120 characters"
        ></commudle-alert>
      </div>

      <!-- ── Category: DROPDOWN for non-admins ── -->
      <div class="ff-field" *ngIf="!isAdmin">
        <label class="ff-label">Category <span class="ff-required">*</span></label>
        <select nbInput fullWidth formControlName="category_name" class="ff-select">
          <option value="" disabled>Select a category</option>
          <option *ngFor="let cat of existingCategories" [value]="cat.name">{{ cat.name }}</option>
        </select>
        <commudle-alert
          *ngIf="topicForm.get('category_name')?.touched && topicForm.get('category_name')?.errors?.['required']"
          [error]="true"
          errorMessage="Please select a category"
        ></commudle-alert>
      </div>

      <!-- ── Category: AUTOCOMPLETE + NEW for admins ── -->
      <div class="ff-field ff-autocomplete-field" *ngIf="isAdmin">
        <label class="ff-label">
          Category <span class="ff-required">*</span>
          <span class="ff-admin-hint">Admin: type to search or create new</span>
        </label>
        <div class="ff-autocomplete-wrap">
          <input
            nbInput
            fullWidth
            formControlName="category_name"
            placeholder="Search existing or type to create new..."
            type="text"
            autocomplete="off"
            (input)="onCategoryInput($event.target['value'])"
            (focus)="onCategoryInput($event.target['value'])"
            (blur)="hideSuggestions()"
          />
          <!-- New category badge -->
          <span class="ff-new-badge" *ngIf="isNewCategory"> <fa-icon [icon]="icons.faCirclePlus"></fa-icon> New </span>
        </div>

        <!-- Suggestions dropdown -->
        <div class="ff-suggestions" *ngIf="showSuggestions && filteredCategories.length > 0">
          <button
            type="button"
            class="ff-suggestion-item"
            *ngFor="let cat of filteredCategories"
            (mousedown)="selectCategory(cat)"
          >
            <fa-icon [icon]="icons.faComment" class="ff-suggestion-icon"></fa-icon>
            <span>{{ cat.name }}</span>
            <span class="ff-suggestion-count">{{ cat.channels_count }} topics</span>
          </button>
        </div>

        <commudle-alert
          *ngIf="topicForm.get('category_name')?.touched && topicForm.get('category_name')?.errors?.['required']"
          [error]="true"
          errorMessage="Category is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="topicForm.get('category_name')?.touched && topicForm.get('category_name')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Cannot exceed 60 characters"
        ></commudle-alert>
      </div>

      <!-- ── Description ── -->
      <div class="ff-field">
        <label class="ff-label">Description <span class="ff-required">*</span></label>
        <textarea
          nbInput
          fullWidth
          formControlName="description"
          rows="4"
          placeholder="Briefly describe what this topic is about..."
        ></textarea>
        <span class="ff-hint">{{ topicForm.get('description')?.value?.length || 0 }} / 500</span>
        <commudle-alert
          *ngIf="topicForm.get('description')?.touched && topicForm.get('description')?.errors?.['required']"
          [error]="true"
          errorMessage="Description is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="topicForm.get('description')?.touched && topicForm.get('description')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Cannot exceed 500 characters"
        ></commudle-alert>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer class="ff-footer">
    <button comButton ghost size="small" (click)="closeForm()">Cancel</button>
    <button
      comButton
      status="primary"
      shape="semi-round"
      size="small"
      [disabled]="topicForm.invalid || isSubmitting"
      (click)="onSubmit()"
    >
      <fa-icon *ngIf="isSubmitting" [icon]="icons.faSpinner" class="ff-spin"></fa-icon>
      {{ isSubmitting ? 'Saving...' : forumId ? 'Save Changes' : 'Create Forum' }}
    </button>
  </nb-card-footer>
</nb-card>
