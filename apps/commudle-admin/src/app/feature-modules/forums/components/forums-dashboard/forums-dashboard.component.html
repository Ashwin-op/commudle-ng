<div class="fd-shell">
  <!-- ── Left sidebar ── -->
  <aside class="fd-sidebar">
    <div class="fd-sidebar-head">
      <h2 class="fd-sidebar-title">Forums</h2>
    </div>

    <nav class="fd-sidebar-nav">
      <a
        class="fd-nav-link"
        [routerLink]="['.']"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="fd-nav-active"
      >
        <fa-icon [icon]="icons.faTableCells"></fa-icon>
        <span>All</span>
      </a>

      <ng-container *ngIf="isLoadingCategories$ | async">
        <div class="fd-nav-skeleton" *ngFor="let i of [1, 2, 3, 4, 5]"></div>
      </ng-container>

      <ng-container *ngIf="!(isLoadingCategories$ | async)">
        <ng-container *ngIf="categories$ | async as categories">
          <a
            *ngFor="let cat of categories.slice(0, sidebarLimit)"
            class="fd-nav-link"
            [routerLink]="[cat.slug]"
            routerLinkActive="fd-nav-active"
          >
            <span>{{ cat.name }}</span>
          </a>

          <a *ngIf="categories.length > sidebarLimit" class="fd-nav-link fd-nav-more" [routerLink]="['.']">
            View all
          </a>
        </ng-container>
      </ng-container>
    </nav>
  </aside>

  <!-- ── Main ── -->
  <main class="fd-main">
    <router-outlet></router-outlet>
  </main>
</div>
