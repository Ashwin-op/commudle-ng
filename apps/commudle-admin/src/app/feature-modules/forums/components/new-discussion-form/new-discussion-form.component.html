<com-card class="ndf-dialog">
  <com-card-header class="ndf-header">
    <div class="ndf-header-content">
      <div class="ndf-header-icon">
        <fa-icon [icon]="icons.faPenToSquare"></fa-icon>
      </div>
      <div>
        <h4 class="ndf-title">{{ title }}</h4>
        <p class="ndf-subtitle">{{ subtitle }}</p>
      </div>
    </div>
    <button comButton ghost size="small" shape="round" (click)="closeDialog()">
      <fa-icon [icon]="icons.faXmark"></fa-icon>
    </button>
  </com-card-header>

  <com-card-body class="ndf-body">
    <form [formGroup]="discussionForm" class="ndf-form">
      <!-- Subject — top-level discussions only; replies don't have one -->
      <div class="ndf-field" *ngIf="!isReply">
        <label class="ndf-label">Subject <span class="ndf-required">*</span></label>
        <input nbInput fullWidth formControlName="subject" type="text" placeholder="What's this discussion about?" />
        <span class="ndf-hint">
          {{ discussionForm.get('subject')?.value?.length || 0 }} / {{ limits.subject.max }}
          <span class="ndf-hint-min">(min {{ limits.subject.min }})</span>
        </span>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['required']"
          [error]="true"
          errorMessage="Subject is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['tooShort']"
          [error]="true"
          [errorMessage]="'Subject must be at least ' + limits.subject.min + ' characters'"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['tooLong']"
          [error]="true"
          [errorMessage]="'Subject cannot exceed ' + limits.subject.max + ' characters'"
        ></commudle-alert>
      </div>

      <!-- Message -->
      <div class="ndf-field">
        <label class="ndf-label">Message <span class="ndf-required">*</span></label>
        <!-- Rich editor so bold/lists/links are available, and so editing shows
             formatted content instead of raw HTML. The dialog footer submits, so the
             editor's own send button is not used. -->
        <commudle-editor
          #messageEditor
          class="ndf-editor"
          [content]="initialMessage"
          [editable]="true"
          [showMenu]="true"
          [selfSubmit]="false"
          [clearOnSubmit]="false"
          placeholder="Describe your question or idea"
        ></commudle-editor>
        <span class="ndf-hint">
          {{ messageLength }} / {{ limits.message.max }}
          <span class="ndf-hint-min">(min {{ limits.message.min }})</span>
        </span>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['required']"
          [error]="true"
          errorMessage="Message is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['tooShort']"
          [error]="true"
          [errorMessage]="'Message must be at least ' + limits.message.min + ' characters'"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['tooLong']"
          [error]="true"
          [errorMessage]="'Message cannot exceed ' + limits.message.max + ' characters'"
        ></commudle-alert>
      </div>
    </form>
  </com-card-body>

  <com-card-footer class="ndf-footer">
    <button comButton ghost size="small" (click)="closeDialog()">Cancel</button>
    <button
      comButton
      status="primary"
      shape="semi-round"
      size="small"
      [disabled]="discussionForm.invalid"
      (click)="onSubmit()"
    >
      <fa-icon [icon]="isEdit ? icons.faPen : icons.faPaperPlane"></fa-icon>
      {{ submitLabel }}
    </button>
  </com-card-footer>
</com-card>
