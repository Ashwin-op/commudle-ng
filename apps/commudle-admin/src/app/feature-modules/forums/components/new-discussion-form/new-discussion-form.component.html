<nb-card class="ndf-dialog">
  <nb-card-header class="ndf-header">
    <div class="ndf-header-content">
      <div class="ndf-header-icon">
        <nb-icon icon="edit-outline"></nb-icon>
      </div>
      <div>
        <h4 class="ndf-title">Start a Discussion</h4>
        <p class="ndf-subtitle">Share your question or idea with the community</p>
      </div>
    </div>
    <button nbButton ghost size="small" shape="round" (click)="closeDialog()">
      <nb-icon icon="close-outline"></nb-icon>
    </button>
  </nb-card-header>

  <nb-card-body class="ndf-body">
    <form [formGroup]="discussionForm" class="ndf-form">
      <!-- Subject -->
      <div class="ndf-field">
        <label class="ndf-label">Subject <span class="ndf-required">*</span></label>
        <input nbInput fullWidth formControlName="subject" type="text" placeholder="What's this discussion about?" />
        <span class="ndf-hint">{{ discussionForm.get('subject')?.value?.length || 0 }} / 120</span>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['required']"
          [error]="true"
          errorMessage="Subject is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Cannot exceed 120 characters"
        ></commudle-alert>
      </div>

      <!-- Message -->
      <div class="ndf-field">
        <label class="ndf-label">Message <span class="ndf-required">*</span></label>
        <textarea
          nbInput
          fullWidth
          formControlName="message"
          rows="6"
          placeholder="Describe your question or share your thoughts in detail..."
        ></textarea>
        <span class="ndf-hint">{{ discussionForm.get('message')?.value?.length || 0 }} / 1000</span>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['required']"
          [error]="true"
          errorMessage="Message is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Cannot exceed 1000 characters"
        ></commudle-alert>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer class="ndf-footer">
    <button nbButton ghost size="small" (click)="closeDialog()">Cancel</button>
    <button
      nbButton
      status="primary"
      shape="semi-round"
      size="small"
      [disabled]="discussionForm.invalid"
      (click)="onSubmit()"
    >
      <nb-icon icon="paper-plane-outline"></nb-icon>
      Post Discussion
    </button>
  </nb-card-footer>
</nb-card>
