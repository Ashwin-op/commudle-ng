<com-card class="round-selection-mailer">
  <com-card-header>
    <span>Send round general email</span>
    <button nbButton shape="round" (click)="closePopup()">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <form [formGroup]="roundGeneralMailerForm">
      <div class="round">
        <label for="round_id">
          Select Round<span class="mandatory-field">*</span>
          <select
            formControlName="round_id"
            [ngClass]="{
              'com-text-[#8E9BB3]': roundGeneralMailerForm.get('round_id').value === ''
            }"
          >
            <option disabled value="">Select round</option>
            <option *ngFor="let hackathonRound of hackathonRounds" [value]="hackathonRound.id">
              {{ hackathonRound.name }}
            </option>
          </select>
        </label>
      </div>
      <div class="subject">
        <label for="subject">
          Subject<span class="mandatory-field">*</span>
          <input formControlName="subject" type="text" nbInput placeholder="Subject" fullWidth />
        </label>
      </div>
      <div class="message">
        <label for="message">Message<span class="mandatory-field">*</span></label>
        <editor [init]="tinyMCE" formControlName="message"></editor>
      </div>
    </form>
  </com-card-body>
  <com-card-footer>
    <button
      (click)="previewEmail(hackathonId); showPreviewSpinner = true"
      nbButton
      status="primary"
      shape="semi-round"
      [nbSpinner]="showPreviewSpinner"
      type="button"
      [disabled]="roundGeneralMailerForm.invalid"
    >
      Preview Email
    </button>
    <button
      nbButton
      shape="semi-round"
      status="primary"
      fullWidth
      [disabled]="roundGeneralMailerForm.invalid"
      (click)="roundGeneralMailer()"
    >
      Send
    </button>
  </com-card-footer>
</com-card>
