<com-card class="send-rsvp-dialog-box">
  <com-card-header>
    <span>Send RSVP Email</span>
    <button nbButton ghost (click)="close()" shape="round">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <commudle-alert
      [info]="true"
      [message]="'This will send a pre-formatted email, you can add any additional message and change the subject'"
    ></commudle-alert>
    <br />
    <div *ngIf="team && !isBulkEmail" class="team-info">
      <p><strong>Team Name:</strong> {{ team.name }}</p>
    </div>
    <form [formGroup]="rsvpForm">
      <div class="form-field">
        <nb-checkbox formControlName="resend">Resend if already sent</nb-checkbox>
      </div>
      <div class="form-field">
        <label>Subject <span class="required">*</span></label>
        <input formControlName="subject" nbInput fullWidth placeholder="Enter email subject" />
      </div>
      <div class="form-field">
        <label>Message (Optional)</label>
        <editor formControlName="message" [init]="tinyMCE"></editor>
      </div>
    </form>
  </com-card-body>
  <com-card-footer>
    <button
      nbButton
      status="primary"
      (click)="previewEmail()"
      [disabled]="rsvpForm.invalid || showPreviewSpinner"
      [nbSpinner]="showPreviewSpinner"
    >
      Preview Email
    </button>
    <button nbButton status="primary" (click)="sendRsvpEmail()" [disabled]="rsvpForm.invalid" fullWidth>Send</button>
  </com-card-footer>
</com-card>
