<com-card class="mail-popup">
  <com-card-header>
    <span>Status Filter General email</span>
    <button nbButton size="small" shape="round" (click)="closeDialogBox()" ghost>
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <commudle-alert [info]="true" message="This will send a pre-formatted email "></commudle-alert>

    <div class="select-recipient">
      <label for="mailType">To</label>
      <div class="all-filter">
        <input
          type="radio"
          name="recipient"
          id="All"
          [(ngModel)]="selectedRecipient"
          value="all"
          class="radio-btn"
          (change)="onRecipientChange()"
        />
        <label for="All">All</label>
      </div>
      <div class="selected-filter">
        <input
          type="radio"
          name="recipient"
          id="SelectedRegistrationOption"
          [(ngModel)]="selectedRecipient"
          value="Selected Registration Option"
          class="radio-btn"
          (change)="onRecipientChange()"
        />
        <label for="SelectedRegistrationOption">Selected Team registration status</label>
      </div>
      <select
        name=""
        id=""
        *ngIf="selectedRecipient === 'Selected Registration Option'"
        [(ngModel)]="selectedHackathonTeamStatus"
        class="selected-status"
      >
        <option disabled selected value="">Select Status</option>
        <option
          *ngFor="let registrationStatus of EHackathonRegistrationStatus | keyvalue"
          [value]="registrationStatus.value"
        >
          {{ registrationStatus.value | capitalizeAndRemoveUnderscore }}
        </option>
      </select>
      <div class="selected-filter">
        <input
          type="radio"
          name="recipient"
          id="SelectedApplicationStatus"
          [(ngModel)]="selectedRecipient"
          value="Selected Application Status"
          class="radio-btn"
          (change)="onRecipientChange()"
        />
        <label for="SelectedApplicationStatus">Selected Individual application status</label>
      </div>
      <select
        name=""
        id=""
        *ngIf="selectedRecipient === 'Selected Application Status'"
        [(ngModel)]="selectedHurStatus"
        class="selected-status"
      >
        <option disabled selected value="">Select Status</option>
        <option *ngFor="let invitationStatus of EInvitationStatus | keyvalue" [value]="invitationStatus.value">
          {{ invitationStatus.value | capitalizeAndRemoveUnderscore }}
        </option>
      </select>
    </div>
    <div class="subject">
      <label for="emailReason">Subject<span class="mandatory-field"> *</span></label>
      <input type="text" placeholder="Subject" [(ngModel)]="subject" nbInput fullWidth />
    </div>
    <div class="message-field">
      <label for="message" class="message">Message<span class="mandatory-field"> *</span></label>
      <editor [init]="tinyMCE" [(ngModel)]="message"></editor>
    </div>
  </com-card-body>
  <com-card-footer>
    <button
      (click)="previewEmail(hackathonId); showPreviewSpinner = true"
      nbButton
      status="primary"
      shape="semi-round"
      [nbSpinner]="showPreviewSpinner"
      type="button"
      [disabled]="showPreviewSpinner || subject.length === 0 || message.length === 0"
    >
      Preview Email
    </button>
    <button
      nbButton
      status="primary"
      shape="semi-round"
      fullWidth
      (click)="SendStatusFilterGeneralMailer()"
      [nbSpinner]="isLoading"
      [disabled]="showPreviewSpinner || subject.length === 0 || message.length === 0"
    >
      Send
    </button>
  </com-card-footer>
</com-card>
