<com-card class="mail-popup">
  <com-card-header>
    <span>Winner Announcement Email</span>
    <button nbButton shape="round" (click)="closeDialogBox()" ghost>
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <commudle-alert [info]="true" message="This will send a pre-formatted email "></commudle-alert>
    <div class="message-field">
      <label for="message" class="message">Message (Optional)</label>
      <editor [init]="tinyMCE" [(ngModel)]="message"></editor>
    </div>
  </com-card-body>
  <com-card-footer>
    <button
      (click)="previewEmail(hackathonId); showPreviewSpinner = true"
      nbButton
      status="primary"
      shape="semi-round"
      [nbSpinner]="showPreviewSpinner"
      type="button"
    >
      Preview Email
    </button>
    <button
      nbButton
      status="primary"
      shape="semi-round"
      fullWidth
      (click)="SendWinnerAnnouncementMailer()"
      [nbSpinner]="isLoading"
      [disabled]="isLoading"
    >
      Send
    </button>
  </com-card-footer>
</com-card>
