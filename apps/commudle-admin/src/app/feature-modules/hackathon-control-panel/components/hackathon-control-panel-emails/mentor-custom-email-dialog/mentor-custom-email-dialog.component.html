<com-card class="mail-popup">
  <com-card-header>
    <span>{{ isBulk ? 'Send Custom Email to All Mentors' : 'Send Custom Email to ' + mentor.name + '' }}</span>
    <button nbButton size="small" shape="round" (click)="closeDialogBox()">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <commudle-alert [info]="true" message="This will send a pre-formatted email "></commudle-alert>
    <form [formGroup]="emailForm">
      <div class="form-group">
        <label for="subject">Subject *</label>
        <input nbInput fullWidth id="subject" formControlName="subject" placeholder="Enter email subject" />
      </div>

      <div class="message-field">
        <label for="message" class="message">Message *</label>
        <editor [init]="tinyMCE" formControlName="message"></editor>
      </div>
    </form>
  </com-card-body>
  <com-card-footer>
    <button
      nbButton
      status="primary"
      shape="semi-round"
      fullWidth
      (click)="sendCustomEmail()"
      [nbSpinner]="isSubmitting"
      [disabled]="isSubmitting || emailForm.invalid"
    >
      Send
    </button>
  </com-card-footer>
</com-card>
