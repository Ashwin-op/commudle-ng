<com-card class="hackathon-judge-mentor-section">
  <com-card-header
    >Judges, Speakers & Mentors<commudle-help-section
      [helpDictionaryName]="'hackathon-judges-speakers'"
    ></commudle-help-section
  ></com-card-header>
  <com-card-body>
    <form action="" [formGroup]="fetchSpeakerJudge">
      <div class="email-select-type-form">
        <form action="" [formGroup]="speakerRegistrationForm">
          <div>
            <label>
              Select Type*
              <div class="select">
                <select
                  formControlName="judge_type"
                  [ngClass]="{
                    'com-text-[#8E9BB3]': speakerRegistrationForm.controls['judge_type'].value === ''
                  }"
                >
                  <option value="" disabled>Select Type</option>
                  <option *ngFor="let judgeType of EHackathonJudgeType | keyvalue" [value]="judgeType.value">
                    {{ judgeType.value | titlecase }}
                  </option>
                </select>
              </div>
            </label>
          </div>
        </form>
        <div class="com-w-3/4">
          <div>
            <label for="email">Enter Email*</label>
            <input
              type="email"
              id="email"
              nbInput
              fullWidth
              formControlName="email"
              placeholder="Enter username or email"
              [nbAutocomplete]="userAutocomplete"
            />
            <nb-autocomplete #userAutocomplete (selectedChange)="selectUser($event)">
              <nb-option *ngFor="let user of userSuggestions" [value]="user.email">
                <app-user-profile-mini [user]="user" [designation]="true" [size]="'small'"></app-user-profile-mini>
              </nb-option>
            </nb-autocomplete>
          </div>
          <commudle-alert
            [error]="fetchSpeakerJudge.controls['email'].hasError('email')"
            errorMessage="Email was invalid"
          ></commudle-alert>
        </div>
      </div>
      <button
        [disabled]="fetchSpeakerJudge.invalid || speakerRegistrationForm.controls['judge_type'].value === ''"
        class="com-w-max com-mt-3"
        nbButton
        status="primary"
        type="submit"
        (click)="fetchSpeakerJudgeDetails()"
      >
        Add
      </button>
    </form>
  </com-card-body>
  <com-card-footer *ngIf="judges && judges.length > 0" class="judge-cards">
    <div *ngFor="let judge of judges; let i = index">
      <commudle-hackathon-judge-card
        [judge]="judge"
        [hackathonId]="hackathon.slug"
        (destroyJudgeEvent)="confirmDeleteDialogBox(deleteJudgeDilaogBox, $event, i)"
        (editJudgeEvent)="openEditJudgeDialogBox(judgeForm, $event, i)"
      ></commudle-hackathon-judge-card>
    </div>
  </com-card-footer>
</com-card>

<ng-template #judgeForm let-data let-ref="dialogRef">
  <com-card class="speaker-form">
    <com-card-header class="actions">
      <span
        >{{ data?.judge ? 'Edit' : 'Add' }} {{ speakerRegistrationForm.controls['judge_type'].value | titlecase }}</span
      >
      <button (click)="ref.close(); resetSpeakerRegistrationForm()" ghost nbButton shape="round" size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <form [formGroup]="speakerRegistrationForm" class="judge-form">
        <!-- Type & Image -->
        <div class="form-row">
          <div class="form-field">
            <label for="judge_type">Type<span class="com-text-red-500">*</span></label>
            <div class="custom-select">
              <select formControlName="judge_type" id="judge_type">
                <option value="" disabled>Select Type</option>
                <option *ngFor="let judgeType of EHackathonJudgeType | keyvalue" [value]="judgeType.value">
                  {{ judgeType.value | titlecase }}
                </option>
              </select>
            </div>
          </div>
          <div class="form-field">
            <label>Profile Image<span class="com-text-red-500">*</span></label>
            <div *ngIf="!imageUrl" class="image-upload">
              <input (change)="onImageChange($event)" type="file" accept="image/*" class="com-hidden" #fileInput />
              <button nbButton size="small" outline (click)="fileInput.click()" type="button">
                <fa-icon [icon]="icons.faFileImage"></fa-icon> Upload
              </button>
            </div>
            <div *ngIf="imageUrl" class="image-preview">
              <img [src]="imageUrl" />
              <button nbButton size="small" status="danger" outline (click)="removeBannerImage()" type="button">
                Replace
              </button>
            </div>
          </div>
        </div>

        <!-- Name & Email -->
        <div class="form-row">
          <div class="form-field">
            <label for="name">Name<span class="com-text-red-500">*</span></label>
            <input placeholder="Name" type="text" nbInput fullWidth id="name" formControlName="name" />
          </div>
          <div class="form-field">
            <label for="email">Email<span class="com-text-red-500">*</span></label>
            <input
              placeholder="Email"
              type="email"
              nbInput
              fullWidth
              id="email"
              formControlName="email"
              [readonly]="profileExist"
            />
          </div>
        </div>

        <!-- Company & Designation -->
        <div class="form-row">
          <div class="form-field">
            <label for="company">Company<span class="com-text-red-500">*</span></label>
            <input placeholder="Company" type="text" nbInput fullWidth id="company" formControlName="company" />
          </div>
          <div class="form-field">
            <label for="designation">Designation<span class="com-text-red-500">*</span></label>
            <input
              placeholder="Designation"
              type="text"
              nbInput
              fullWidth
              id="designation"
              formControlName="designation"
            />
          </div>
        </div>

        <!-- About -->
        <div class="form-field">
          <label for="about">About<span class="com-text-red-500">*</span></label>
          <textarea formControlName="about" nbInput fullWidth id="about" placeholder="About" rows="2"></textarea>
        </div>

        <!-- Phone -->
        <div class="form-row">
          <div class="form-field">
            <label for="phone_country_code">Country Code</label>
            <div class="custom-select">
              <select formControlName="phone_country_code" id="phone_country_code">
                <option value="">Select Code</option>
                <option *ngFor="let country of countries" [value]="country.phone">
                  {{ country.name }} (+{{ country.phone }})
                </option>
              </select>
            </div>
          </div>
          <div class="form-field">
            <label for="phone">Phone</label>
            <input placeholder="Phone" type="text" nbInput fullWidth id="phone" formControlName="phone" />
          </div>
        </div>

        <!-- Social Links -->
        <div class="form-row-3">
          <div class="form-field">
            <label for="linkedin">LinkedIn</label>
            <input placeholder="LinkedIn URL" type="text" nbInput fullWidth id="linkedin" formControlName="linkedin" />
            <commudle-alert
              *ngIf="speakerRegistrationForm.get('linkedin').hasError('invalidUrl')"
              [error]="true"
              errorMessage="Enter complete URL"
            ></commudle-alert>
          </div>
          <div class="form-field">
            <label for="twitter">Twitter</label>
            <input placeholder="Twitter URL" type="text" nbInput fullWidth id="twitter" formControlName="twitter" />
            <commudle-alert
              *ngIf="speakerRegistrationForm.get('twitter').hasError('invalidUrl')"
              [error]="true"
              errorMessage="Enter complete URL"
            ></commudle-alert>
          </div>
          <div class="form-field">
            <label for="website">Website</label>
            <input placeholder="Website URL" type="text" nbInput fullWidth id="website" formControlName="website" />
            <commudle-alert
              *ngIf="speakerRegistrationForm.get('website').hasError('invalidUrl')"
              [error]="true"
              errorMessage="Enter complete URL"
            ></commudle-alert>
          </div>
        </div>
      </form>
    </com-card-body>
    <com-card-footer>
      <button
        [disabled]="speakerRegistrationForm.invalid || imageUrl?.length === 0"
        type="submit"
        nbButton
        fullWidth
        status="primary"
        (click)="data?.judge ? updateJudge(data.judge.id, data.index) : createJudge(); ref.close()"
      >
        {{ data?.judge ? 'Update' : 'Save' }}
      </button>
    </com-card-footer>
  </com-card>
</ng-template>

<ng-template #deleteJudgeDilaogBox let-ref="dialogRef" let-data>
  <com-card>
    <com-card-header class="actions">
      <span>Confirm Delete</span>
      <button nbButton ghost (click)="ref.close()" shape="round">
        <fa-icon [icon]="icons.faXmark"></fa-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <p>Are you sure you want to delete this judge/mentor/speaker?</p>
      <commudle-alert
        [error]="true"
        errorMessage="Warning: All scores allocated by this judge/mentor and their team assignments will be permanently deleted. This action cannot be undone."
      ></commudle-alert>
    </com-card-body>
    <com-card-footer class="actions">
      <button nbButton status="danger" (click)="destroyJudge(data.judgeId, data.index); ref.close()">Delete</button>
      <button nbButton status="basic" (click)="ref.close()" outline>Cancel</button>
    </com-card-footer>
  </com-card>
</ng-template>
