<nb-card>
  <nb-card-header
    >Tracks & Prizes<commudle-help-section [helpDictionaryName]="'hackathon-tracks-prizes'"></commudle-help-section
  ></nb-card-header>
  <nb-card-body>
    <div *ngIf="hackathon" class="problem-statement-toggle">
      <div class="toggle-info">
        <span class="toggle-label">Allow participants to change Problem Statement</span>
        <span class="toggle-hint"
          >When enabled, participants can change their track & problem statement before the application deadline.</span
        >
      </div>
      <label class="toggle-switch">
        <input
          type="checkbox"
          [checked]="hackathon.allow_problem_statement_change"
          [disabled]="isTogglingProblemStatement"
          (change)="toggleProblemStatementChange($any($event.target).checked)"
        />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="router-tab">
      <nb-route-tabset [tabs]="tabs"></nb-route-tabset>
    </div>
  </nb-card-body>
</nb-card>

<div *ngIf="hackathon" class="next-step-container">
  <a>
    Next Step
    <fa-icon [icon]="icons.faArrowRight"></fa-icon>
  </a>
  <div class="next-steps-card">
    <commudle-next-step-card
      headingText="Setup Rounds"
      subHeadingText="Create the process flow for rounds through which the teams will progress during the hackathon."
      [routerLink]="
        '/admin' + '/communities/' + hackathon.community.slug + '/hackathon-dashboard/' + hackathon.slug + '/rounds'
      "
      [faIcon]="icons.faGamepad"
    ></commudle-next-step-card>
    <commudle-next-step-card
      headingText="Setup Registration Form"
      subHeadingText="Create a registration form to enable participants to register for the hackathon and submit projects."
      [routerLink]="
        '/admin' +
        '/communities/' +
        hackathon.community.slug +
        '/hackathon-dashboard/' +
        hackathon.slug +
        '/registrations'
      "
      [faIcon]="icons.faRectangleList"
    ></commudle-next-step-card>
    <commudle-next-step-card
      headingText="Add Judges, Speakers"
      subHeadingText="Add and showcase the profile of judges, speakers and mentors at your hackathon with the participants."
      [routerLink]="
        '/admin' + '/communities/' + hackathon.community.slug + '/hackathon-dashboard/' + hackathon.slug + '/speakers'
      "
      [faIcon]="icons.faMicrophone"
    ></commudle-next-step-card>
  </div>
</div>
