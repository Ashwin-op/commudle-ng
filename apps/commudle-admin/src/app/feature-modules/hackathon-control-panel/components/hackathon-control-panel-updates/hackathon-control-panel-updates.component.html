<div>
  <com-card class="updates">
    <com-card-body>
      <h6 class="com-mt-0 com-mb-2">
        <span>Updates</span><commudle-help-section [helpDictionaryName]="'hackathon-updates'"></commudle-help-section>
      </h6>
      <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
      <div *ngFor="let eu of updates; let i = index" class="updates">
        <div>
          <div class="com-flex com-gap-2 com-items-baseline com-w-max com-max-w-[90%] md:com-w-full">
            <commudle-editor [content]="eu.details" [editable]="false" class="com-w-full"></commudle-editor>
            <span class="delete-event-update clickable" (click)="confirmDeleteEventUpdate(deleteDialog, eu.id, i)">
              <fa-icon [icon]="icons.faXmark"></fa-icon>
            </span>
          </div>
          <div class="image-section" *ngIf="eu.images">
            <div *ngFor="let img of eu.images" class="images">
              <img [src]="img.i128" alt="" />
            </div>
          </div>

          <small>
            <span class="com-text-Auro-Metal-Saurus"
              >{{ moment(eu.created_at).format('LT DD-MM-YYYY') }} by {{ eu.user.name }}</span
            >
          </small>
        </div>
        <div class="votes">
          <app-votes-display
            [icon]="'heart-outline'"
            [votableId]="eu.id"
            votableType="EventUpdate"
            [textAlignment]="'after'"
          ></app-votes-display>
        </div>
      </div>
    </com-card-body>
    <com-card-footer class="com-sticky com-bg-white com-bottom-0">
      <commudle-editor
        #editor
        [addAttachment]="true"
        (contentChange)="createEventUpdate($event)"
        (uploadImages)="uploadImages($event)"
      ></commudle-editor>

      <div *ngIf="showPreviewImages" class="image-preview-section">
        <div *ngFor="let image of images; let i = index" class="images">
          <img [src]="image.url" [alt]="image.name" class="" />
          <div class="delete" (click)="removeImage(i)">
            <fa-icon [icon]="icons.faXmark"></fa-icon>
          </div>
        </div>
      </div>
    </com-card-footer>
  </com-card>
</div>

<ng-template #deleteDialog let-data let-ref="dialogRef">
  <com-card class="delete-event-update-dialog">
    <com-card-header>
      <div>Delete Update</div>
      <button ghost nbButton size="small" (click)="ref.close()" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <div>Are you sure you want to delete this Update?</div>
      <em>This action can not be undone</em>
    </com-card-body>
    <com-card-footer>
      <button nbButton status="primary" (click)="deleteEventUpdate(data.entityUpdateId, data.index); ref.close()">
        Confirm
      </button>
      <button nbButton status="danger" (click)="ref.close()">Cancel</button>
    </com-card-footer>
  </com-card>
</ng-template>
