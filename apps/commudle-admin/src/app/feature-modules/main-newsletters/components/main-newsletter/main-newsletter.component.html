<div class="base-layout thin">
  <div class="container">
    <div class="one-column-layout">
      <com-card [nbSpinner]="!mainNewsletter">
        <com-card-header>
          <h1 class="newsletter-title">
            {{ mainNewsletter?.title || 'Loading...' }}
          </h1>
        </com-card-header>
        <com-card-body>
          <div *ngIf="mainNewsletter" [innerHTML]="sanitizedContent"></div>
        </com-card-body>
      </com-card>
    </div>
  </div>
</div>
