<div class="community-hackathons">
  <nb-card *ngIf="upcomingHackathons && upcomingHackathons.length > 0" class="hackathon-section-card com-mt-4">
    <nb-card-body class="body-container com-p-0 md:com-p-6">
      <section class="upcoming-hackathons-section">
        <h2 class="heading com-text-tYankees-Blue">
          <span class="live-dot" aria-hidden="true"></span>
          Upcoming Hackathons
        </h2>
        <div
          class="upcoming-hackathon-container"
          [ngClass]="{
            'com-grid-cols-1': upcomingHackathons.length === 1,
            'com-grid-cols-2': upcomingHackathons.length >= 2
          }"
        >
          <div *ngFor="let hackathon of upcomingHackathons" class="upcoming-hackathon-card-wrapper">
            <commudle-hackathon-large-card [hackathon]="hackathon"></commudle-hackathon-large-card>
          </div>
        </div>
      </section>
    </nb-card-body>
  </nb-card>

  <nb-card *ngIf="pastHackathons && pastHackathons.length > 0" class="hackathon-section-card px-4">
    <nb-card-body class="body-container com-p-4 md:com-p-6">
      <section class="past-hackathons">
        <h2 class="heading">Past Hackathons</h2>
        <div class="past-hackathons-container">
          <div *ngFor="let hackathon of pastHackathons" class="past-hackathon-card-wrapper">
            <commudle-hackathon-medium-card [hackathon]="hackathon"></commudle-hackathon-medium-card>
          </div>
        </div>
      </section>
    </nb-card-body>
  </nb-card>
</div>
