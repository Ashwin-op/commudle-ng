<div class="community-hackathons">
  <nb-card *ngIf="upcomingHackathons && upcomingHackathons.length > 0" class="hackathon-section-card">
    <nb-card-body>
      <section>
        <h2 class="heading">Upcoming Hackathons</h2>
        <div
          class="upcoming-hackathon"
          [ngClass]="{
            'com-grid-cols-1': upcomingHackathons.length === 1,
            'com-grid-cols-2': upcomingHackathons.length >= 2
          }"
        >
          <div *ngFor="let hackathon of upcomingHackathons">
            <commudle-hackathon-large-card [hackathon]="hackathon"></commudle-hackathon-large-card>
          </div>
        </div>
      </section>
    </nb-card-body>
  </nb-card>

  <nb-card *ngIf="pastHackathons && pastHackathons.length > 0" class="hackathon-section-card">
    <nb-card-body>
      <section>
        <h2 class="heading">Past Hackathons</h2>
        <div class="past-hackathons">
          <div *ngFor="let hackathon of pastHackathons">
            <commudle-hackathon-medium-card [hackathon]="hackathon"></commudle-hackathon-medium-card>
          </div>
        </div>
      </section>
    </nb-card-body>
  </nb-card>
</div>
