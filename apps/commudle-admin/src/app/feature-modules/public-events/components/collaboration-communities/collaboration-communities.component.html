<nb-card *ngIf="collaborationCommunities.length > 0" class="collaborations-card">
  <nb-card-header>
    <h6 class="title collaborations-card-heading section-heading-anchor">
      <nb-icon icon="pricetags-outline" status="warning"></nb-icon>
      <span>Collaborations</span>
      <a [routerLink]="['.']" fragment="collaborations" class="anchor-link" aria-label="Link to collaborations section">
        <fa-icon [icon]="faLink" class="anchor-icon-small"></fa-icon>
      </a>
    </h6>
  </nb-card-header>
  <nb-card-body class="collaborations-card-body">
    <div *ngIf="summary.totalCommunities > 1" class="collaborations-summary" role="status">
      <p class="collaborations-summary-text">
        <span class="collaborations-summary-segment"
          ><strong>{{ summary.totalCommunities }}</strong> communities</span
        >
        <span class="collaborations-summary-dot" aria-hidden="true">·</span>
        <span class="collaborations-summary-segment"
          ><strong>{{ summary.combinedMembers | number }}</strong> members combined</span
        >
      </p>
    </div>
    <ul class="collaborations-list">
      <li *ngFor="let cc of collaborationCommunities; let i = index" class="collaborations-list-item">
        <a
          [routerLink]="['/communities', cc.community.slug]"
          class="collaboration-community-card"
          [style.--collaboration-logo-wrap-bg]="logoTints[cc.community.id]?.wrap"
          [style.--collaboration-logo-gradient]="logoTints[cc.community.id]?.gradient"
        >
          <div class="collaboration-community-logo-wrap">
            <img
              [alt]="cc.community.name"
              [src]="cc.community.logo_image?.i64 || cc.community.logo_image_path?.i64"
              [title]="cc.community.name"
              class="collaboration-community-logo-image"
              crossorigin="anonymous"
              loading="lazy"
            />
          </div>
          <h2 class="collaboration-community-title">{{ cc.community.name }}</h2>
          <p class="collaboration-community-subtitle">
            {{ cc.community.mini_description }}
          </p>
          <div class="collaboration-community-footer">
            <div class="collaboration-community-footer-meta">
              <div class="collaboration-community-divider" aria-hidden="true"></div>
              <span class="collaboration-community-foot-members">
                <strong>{{ cc.community.members_count | number }}</strong> members
              </span>
            </div>
          </div>
        </a>
      </li>
    </ul>
  </nb-card-body>
</nb-card>
