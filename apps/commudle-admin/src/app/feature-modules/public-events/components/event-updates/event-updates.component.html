<com-card *ngIf="eventUpdates.length > 0" id="updates">
  <com-card-header>
    <h6 class="title">
      <a [routerLink]="'.'" fragment="updates"><nb-icon icon="star-outline" status="warning"></nb-icon> Updates</a>
    </h6>
  </com-card-header>
  <com-card-body>
    <div *ngFor="let eu of eventUpdates" class="event-update">
      <div class="update-content">
        <commudle-editor [content]="eu.details" [editable]="false"></commudle-editor>
        <div class="image-section" *ngIf="eu.images">
          <div *ngFor="let img of eu.images" class="images" (click)="openImage(img, eu)">
            <img [src]="img.i128" alt="" />
          </div>
        </div>
      </div>
      <div class="update-footer">
        <p class="time">{{ moment(eu.created_at).format('h:mm A · ddd, Do MMM YYYY') }}</p>
        <app-votes-display
          [icon]="'heart-outline'"
          [votableId]="eu.id"
          votableType="EventUpdate"
          [textAlignment]="'after'"
        ></app-votes-display>
      </div>
    </div>
  </com-card-body>
  <com-card-footer *ngIf="page_info.has_next_page" (click)="getEventUpdates()" class="com-cursor-pointer">
    <div>
      View More
      <nb-icon icon="arrow-ios-downward-outline"></nb-icon>
    </div>
  </com-card-footer>
</com-card>

<ng-template #imageTemplate let-ref="dialogRef" let-data>
  <div class="image-window">
    <div class="image-window-header">
      <span>Image Preview</span>
      <button (click)="ref.close()" nbButton size="small" ghost>
        <nb-icon icon="close"></nb-icon>
      </button>
    </div>
    <div class="image-window-body" *ngIf="data.image.url">
      <img [src]="data.image.url" [alt]="data.eventUpdate.details" />
    </div>
  </div>
</ng-template>
