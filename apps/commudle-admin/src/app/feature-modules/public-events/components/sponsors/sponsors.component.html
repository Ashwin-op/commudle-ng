<div
  *ngIf="eventSponsorGroupedByTierName && (eventSponsorGroupedByTierName | keyvalue)?.length"
  id="sponsors"
  class="sponsors"
>
  <nb-card>
    <nb-card-header>
      <h6 class="title collaborations-card-heading section-heading-anchor">
        <fa-icon [icon]="icons.faSackDollar" class="sponsors-card-heading-icon"></fa-icon>
        <span>Sponsors</span>
        <a [routerLink]="['.']" fragment="sponsors" class="anchor-link" aria-label="Link to sponsors section">
          <fa-icon [icon]="icons.faLink" class="anchor-icon-small"></fa-icon>
        </a>
      </h6>
    </nb-card-header>
    <nb-card-body class="sponsors-cards">
      <div *ngFor="let eventSponsorGrouped of eventSponsorGroupedByTierName | keyvalue" class="sponsor-tier">
        <header
          class="sponsor-tier-header"
          [ngClass]="'sponsor-tier-header--priority-' + (eventSponsorGrouped.value?.[0]?.tier_priority || 1)"
        >
          <span class="sponsor-tier-dot" aria-hidden="true"></span>
          <span class="sponsor-tier-heading">{{ eventSponsorGrouped.key }}</span>
          <span class="sponsor-tier-count">
            {{ (eventSponsorGrouped.value || []).length }}
            {{ (eventSponsorGrouped.value || []).length === 1 ? 'partner' : 'partners' }}
          </span>
        </header>

        <div
          class="sponsor-tier-strips"
          [ngClass]="{
            'sponsor-tier-strips--cols-1': eventSponsorGrouped.value?.[0]?.tier_priority <= 2,
            'sponsor-tier-strips--cols-2': eventSponsorGrouped.value?.[0]?.tier_priority >= 3
          }"
        >
          <a
            *ngFor="let eventSponsor of eventSponsorGrouped.value || []"
            [href]="eventSponsor.sponsor.link ? eventSponsor.sponsor.link : null"
            target="_blank"
            class="sponsor-strip"
            [class.sponsor-strip--tier-1]="eventSponsor.tier_priority === 1"
            [class.sponsor-strip--tier-2]="eventSponsor.tier_priority === 2"
            [ngClass]="{ 'sponsor-strip--no-link': !eventSponsor.sponsor.link }"
            [style.--sponsor-logo-gradient]="sponsorLogoTints[eventSponsor.id]?.gradient"
            (mouseenter)="onSponsorStripGradientEnter($event)"
            (mousemove)="onSponsorStripGradientMove($event)"
            (mouseleave)="onSponsorStripGradientLeave($event)"
            (click)="!eventSponsor.sponsor.link && $event.preventDefault()"
          >
            <span class="sponsor-strip-mouse-gradient" aria-hidden="true"></span>
            <div class="sponsor-strip-logo-wrap">
              <img
                [src]="eventSponsor.sponsor.logo.i320 || eventSponsor.sponsor.logo.url"
                [alt]="eventSponsor.sponsor.name"
                loading="lazy"
                class="sponsor-strip-logo"
                crossorigin="anonymous"
              />
            </div>
            <div class="sponsor-strip-text">
              <h3 class="sponsor-strip-name">{{ eventSponsor.sponsor.name }}</h3>
              <p *ngIf="eventSponsor.description" class="sponsor-strip-description">
                {{ eventSponsor.description }}
              </p>
            </div>
          </a>
        </div>
      </div>
    </nb-card-body>
  </nb-card>
</div>
