<div class="two-column-layout medium mobile-reverse">
  <div class="main-column">
    <div *ngIf="isLoading" class="loading">
      <commudle-loading-spinner></commudle-loading-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <!-- Header & Stats -->
      <div class="page-header">
        <div class="stats-row">
          <div class="stat-item" *ngIf="judges.length > 0">
            <span class="stat-number">{{ judges.length }}</span>
            <span class="stat-label">Judges</span>
          </div>
          <div class="stat-item" *ngIf="mentors.length > 0">
            <span class="stat-number">{{ mentors.length }}</span>
            <span class="stat-label">Mentors</span>
          </div>
        </div>
      </div>

      <!-- Judges Section -->
      <com-card *ngIf="judges.length > 0" class="section-card">
        <com-card-header>
          <h3 class="section-title">Judges</h3>
        </com-card-header>
        <com-card-body>
          <div class="people-grid">
            <app-speaker-card *ngFor="let judge of judges" [speaker]="judge"></app-speaker-card>
          </div>
        </com-card-body>
      </com-card>

      <!-- Mentors Section -->
      <com-card *ngIf="mentors.length > 0" class="section-card">
        <com-card-header>
          <h3 class="section-title">Mentors</h3>
        </com-card-header>
        <com-card-body>
          <div class="people-grid">
            <app-speaker-card *ngFor="let mentor of mentors" [speaker]="mentor"></app-speaker-card>
          </div>
        </com-card-body>
      </com-card>
    </ng-container>
  </div>
  <div class="right-column">
    <commudle-public-hackathon-details-mini-card
      [hackathon]="hackathon"
      [community]="community"
    ></commudle-public-hackathon-details-mini-card>
  </div>
</div>
