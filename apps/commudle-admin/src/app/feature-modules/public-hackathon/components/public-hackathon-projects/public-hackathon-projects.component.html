<com-card>
  <com-card-body>
    <commudle-loading-spinner *ngIf="isLoading; else projectCards"></commudle-loading-spinner>
    <ng-template #projectCards>
      <div *ngIf="communityBuilds.length === 0">No Project to show</div>
      <com-card *ngFor="let build of communityBuilds" class="project-card">
        <com-card-body>
          <commudle-build-card [communityBuild]="build" [showHackathonPrizes]="true"></commudle-build-card>
        </com-card-body>
      </com-card>
      <div class="pagination" *ngIf="total > 0">
        <app-pagination
          (goTo)="page = $event; fetchHackathonProjects()"
          (next)="page = $event; fetchHackathonProjects()"
          (previous)="page = $event; fetchHackathonProjects()"
          [count]="count"
          [current]="page"
          [total]="total"
        ></app-pagination>
      </div>
    </ng-template>
  </com-card-body>
</com-card>
