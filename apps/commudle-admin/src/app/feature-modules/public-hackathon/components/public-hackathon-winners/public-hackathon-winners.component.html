<div *ngIf="isLoading; else winnersContent" class="loading">
  <commudle-loading-spinner></commudle-loading-spinner>
</div>
<ng-template #winnersContent>
  <div *ngIf="winnersByPrize.length === 0" class="empty-state">
    <p>No winners announced yet.</p>
  </div>
  <div class="winners-main" *ngIf="winnersByPrize.length > 0">
    <div class="winners-header">
      <fa-icon [icon]="icons.faTrophy" class="winners-header-icon"></fa-icon>
      <div>
        <h2 class="winners-title">Winners</h2>
        <p class="winners-subtitle">Congratulations to all the winning teams!</p>
      </div>
    </div>
    <div class="winners-list">
      <div *ngFor="let entry of winnersByPrize" class="winner-card" [ngClass]="getPrizeRankClass(entry.prize.order)">
        <div class="winner-card-header">
          <div class="winner-trophy" *ngIf="entry.prize.order <= 3">
            <img *ngIf="entry.prize.order === 1" [src]="staticAssets.hackathon_trophy_winner" alt="Winner Trophy" />
            <img *ngIf="entry.prize.order === 2" [src]="staticAssets.hackathon_trophy_silver" alt="Silver Trophy" />
            <img *ngIf="entry.prize.order === 3" [src]="staticAssets.hackathon_trophy_bronze" alt="Bronze Trophy" />
          </div>
          <div class="winner-prize-info">
            <div class="prize-badge">
              <fa-icon [icon]="icons.faTrophy" class="badge-icon"></fa-icon>
              <span>{{ entry.prize.name }}</span>
            </div>
            <div class="prize-amount" *ngIf="entry.prize.prize_amount">
              {{ entry.prize.currency_symbol }} {{ entry.prize.prize_amount | number }}
            </div>
            <div class="prize-description" *ngIf="entry.prize.description" [innerHTML]="entry.prize.description"></div>
          </div>
          <div class="prize-track-chip" *ngIf="entry.prize.hackathon_track">
            <fa-icon [icon]="icons.faLayerGroup"></fa-icon>
            <span>{{ entry.prize.hackathon_track.name }}</span>
          </div>
        </div>
        <div class="winning-teams">
          <div *ngFor="let team of entry.winning_teams" class="team-card">
            <div class="team-name">
              {{ team.name }}
              <a
                *ngIf="team.community_build"
                [routerLink]="['/builds', team.community_build.slug]"
                target="_blank"
                class="build-chip"
              >
                <fa-icon [icon]="icons.faLaptopCode"></fa-icon>
                <span>Project</span>
              </a>
            </div>
            <div class="team-members" *ngIf="team.members?.length">
              <app-user-profile-card-small
                *ngFor="let member of team.members"
                [user]="member"
              ></app-user-profile-card-small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
