<com-card>
  <com-card-header>
    Delete a Featured Community Build

    <button (click)="close()" ghost nbButton size="small">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>

  <com-card-body>Are you sure you want to delete?</com-card-body>

  <com-card-footer>
    <button (click)="deleteFeaturedCommunity()" nbButton status="success">Yes</button>
    <button (click)="close()" nbButton status="danger">No</button>
  </com-card-footer>
</com-card>
