<com-card class="admin-assets-list">
  <com-card-header class="d-flex justify-content-space-between align-items-center">
    <span>Static Assets</span>
    <div>
      <button [routerLink]="['/sys-admin', 'static-assets', 'new']" ghost nbButton shape="round" size="small">
        <nb-icon icon="plus"></nb-icon>
        Create Assets
      </button>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="search-container">
      <input
        [(ngModel)]="searchQuery"
        (ngModelChange)="filterAssets()"
        type="text"
        nbInput
        fullWidth
        placeholder="Search by name or ID..."
        fieldSize="small"
      />
    </div>
    <div class="assets-list-container">
      <nb-list>
        <nb-list-item *ngFor="let asset of assets" class="d-flex justify-content-space-between">
          <div class="assets-details">
            <p class="title">
              {{ asset.name }}
              ({{ asset.id }})
            </p>
            <div *ngIf="asset.file" class="asset-image">
              <img alt="{{ asset.name }}" src="{{ asset.file.url }}" title="{{ asset.name }}" />
            </div>
          </div>
          <div class="controls">
            <a
              *ngIf="asset.file"
              href="{{ asset.file.url }}"
              nbButton
              outline
              size="small"
              status="primary"
              target="_blank"
            >
              Link
            </a>
            <button
              *ngIf="asset.file"
              (click)="openCopyLinkDialog(copyLinkDialog, asset.file.url)"
              nbButton
              outline
              size="small"
              status="info"
            >
              Copy Link
            </button>
          </div>
        </nb-list-item>
      </nb-list>
      <button (click)="getAsset()" *ngIf="assets.length !== total" fullWidth ghost nbButton>Get more Assets</button>
    </div>
  </com-card-body>
</com-card>

<ng-template #copyLinkDialog let-data let-ref="dialogRef">
  <com-card class="copy-link-card">
    <com-card-header>Copy Asset Link</com-card-header>
    <com-card-body>
      <div class="copy-link-container">
        <div class="link-wrapper" (click)="copyLink(data.url)">
          <p class="link-text">{{ data.url }}</p>
          <nb-icon icon="copy-outline" class="copy-icon"></nb-icon>
        </div>
      </div>
    </com-card-body>
    <com-card-footer class="d-flex justify-content-end">
      <button (click)="ref.close()" nbButton size="small" status="primary">Close</button>
    </com-card-footer>
  </com-card>
</ng-template>
