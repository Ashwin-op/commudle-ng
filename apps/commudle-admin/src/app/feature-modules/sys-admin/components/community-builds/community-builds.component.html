<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <com-card class="community-builds">
        <com-card-header>
          <h4>Community Builds</h4>
          <div class="select">
            <select [ngModel]="selectedBuildStatus" (ngModelChange)="fetchBuildsByStatus($event)">
              <option *ngFor="let ps of publishStatuses" [value]="EPublishStatus[ps]">
                {{ EPublishStatus[ps] | titlecase }}
              </option>
            </select>
          </div>
        </com-card-header>
        <com-card-body>
          @if (isLoading) {
          <app-loading-spinner></app-loading-spinner>
          } @else {
          <div *ngFor="let cb of cBuilds" class="community-build">
            <div class="content">
              <p>
                <small>Created: {{ moment(cb.created_at).fromNow() }}</small>
              </p>
              <p>
                <small>Updated: {{ moment(cb.updated_at).fromNow() }}</small>
              </p>
              <p *ngIf="cb.published_at">
                <small>Published: {{ moment(cb.published_at).fromNow() }}</small>
              </p>
              <h5>
                {{ cb.name }}
                <a [routerLink]="['/builds', cb.slug]" target="_blank">
                  <nb-icon icon="external-link"></nb-icon>
                </a>
              </h5>
            </div>
            <div class="creator">
              <app-user-profile-horizontal [socialMediaLinks]="true" [user]="cb.user"></app-user-profile-horizontal>
              <p>
                {{ cb.user.email }}
              </p>
            </div>
            <div class="stats">
              <div>
                <app-votes-display
                  [icon]="'star'"
                  [votableId]="cb.id"
                  [votableType]="'CommunityBuild'"
                ></app-votes-display>
              </div>
              <div class="tags" *ngIf="cb.tags">
                <app-tag
                  [tags]="cb.tags"
                  [backgroundColor]="'com-bg-[#F6F9FC]'"
                  [fontColor]="'com-text-tYankees-Blue'"
                  size="tiny"
                ></app-tag>
              </div>
            </div>
            <div class="actions">
              <div class="select">
                <select [ngModel]="cb.publish_status" (ngModelChange)="updatePublishStatus($event, cb.id)">
                  <option *ngFor="let ps of publishStatuses" [value]="EPublishStatus[ps]">
                    {{ EPublishStatus[ps] | titlecase }}
                  </option>
                </select>
              </div>
              <div>
                <button [routerLink]="['/builds', cb.slug, 'edit']" nbButton outline size="tiny" status="info">
                  Edit
                </button>
              </div>
            </div>
          </div>
          }
        </com-card-body>
        <com-card-footer
          ><div class="pagination">
            <app-pagination
              (goTo)="page = $event; getBuilds()"
              (next)="page = $event; getBuilds()"
              (previous)="page = $event; getBuilds()"
              *ngIf="total > 0"
              [count]="count"
              [current]="page"
              [total]="total"
            ></app-pagination></div
        ></com-card-footer>
      </com-card>
    </div>
  </div>
</div>
