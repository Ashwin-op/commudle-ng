<div
  class="chat-window"
  [ngClass]="{ 'full-page-mode': fullPageMode }"
  [style.width.px]="fullPageMode ? null : chatsWindowWidth"
>
  <com-card>
    <com-card-header class="clickable">
      <div class="window-options">
        <div class="window-user">
          <app-user-profile-mini
            [size]="'small'"
            [user]="discussionFollower.user"
            [showOnlineText]="true"
            [truncateName]="true"
            [addPadding]="false"
          ></app-user-profile-mini>
        </div>
        <div *ngIf="discussion" class="window-actions com-flex com-items-center">
          <button ghost nbButton [nbContextMenu]="items" nbContextMenuTag="user-personal-chat-menu-{{ discussion.id }}">
            <nb-icon icon="more-vertical" pack="eva"></nb-icon>
          </button>
          <!-- <nb-menu tag="menu" [items]="items"></nb-menu> -->
          <button (click)="toggleChatsWindowHeight()" ghost nbButton>
            <fa-icon [icon]="isMinimized ? faUpRightAndDownLeftFromCenter : faDownLeftAndUpRightToCenter"></fa-icon>
          </button>
          <button (click)="closeChat()" ghost nbButton>
            <nb-icon icon="close" pack="eva"></nb-icon>
          </button>
        </div>
      </div>
    </com-card-header>
    <com-card-body
      [style.height.vh]="fullPageMode ? null : chatsWindowHeight"
      [style.maxHeight.vh]="fullPageMode ? null : chatsWindowHeight"
      [style.minHeight.vh]="fullPageMode ? null : chatsWindowHeight"
    >
      <app-discussion-personal-chat
        *ngIf="discussion"
        [discussion]="discussion"
        [user]="discussionFollower.user"
        (discussionSubscribed)="getMenuBlockedTitle()"
      ></app-discussion-personal-chat>
    </com-card-body>
  </com-card>
</div>
