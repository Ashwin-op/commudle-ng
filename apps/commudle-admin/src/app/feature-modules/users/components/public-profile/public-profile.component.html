<div class="base-layout">
  <div class="container">
    <div *ngIf="user" class="two-column-layout medium">
      <div class="main-column">
        <app-user-basic-details
          (updateProfile)="getUser()"
          [noMenuItems]="(activeMenuItems | numkeys) === 0"
        ></app-user-basic-details>
        <div #stickySentinel class="sticky-sentinel"></div>
        <com-card
          *ngIf="(activeMenuItems | numkeys) > 0"
          class="user-profile-menu"
          [ngClass]="{ 'sticky-active': isMenuSticky }"
        >
          <com-card-body class="com-scrollbar-hide">
            <nb-actions>
              <nb-action *ngFor="let item of activeMenuItems | keyvalue : originalOrder" class="com-flex-col">
                <a class="item" fragment="{{ item.value.link }}" routerLink=".">
                  <fa-icon
                    [icon]="item.value.icon"
                    class="{{ highlight === item.value.link ? item.value.active_color : 'com-text-Black-Coral' }}"
                  ></fa-icon>
                  <span>
                    {{ item.value.name }}
                  </span>
                </a>
                <div *ngIf="highlight === item.value.link" class="highlight"></div>
              </nb-action>
            </nb-actions>
          </com-card-body>
        </com-card>
        <div *appBreakpoints="'<=md'">
          <div class="user-stats">
            <commudle-public-profile-campaign></commudle-public-profile-campaign>
          </div>
        </div>
        <router-outlet></router-outlet>
        <router-outlet name="p"></router-outlet>
      </div>
      <div *appBreakpoints="'>md'" class="right-column">
        <div class="user-stats">
          <commudle-user-features-stats [user]="user"></commudle-user-features-stats>
        </div>
        <app-user-badges [user]="user"></app-user-badges>
        <commudle-public-profile-campaign></commudle-public-profile-campaign>
      </div>
    </div>
  </div>
</div>
