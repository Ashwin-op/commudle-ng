<com-card class="user-basic-social-container" id="about">
  <com-card-header>
    <a [routerLink]="'.'" fragment="about"
      ><fa-icon [icon]="faExclamationCircle" class="com-text-primary-500"></fa-icon>About</a
    >
  </com-card-header>
  <com-card-body>
    <div *ngIf="user.about_me" class="about">
      <span class="about-text">
        {{ showFullAbout ? user.about_me : (user.about_me | truncatetext : 350) }}
      </span>
      <a (click)="showFullAbout = !showFullAbout" *ngIf="user.about_me.length > 350" class="read-more-link">
        {{ showFullAbout ? 'Read less' : 'Read more' }}
      </a>
    </div>
    <div class="user-social">
      <a
        *ngIf="isValid(user.personal_website)"
        href="{{ user.personal_website | completeurl }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faGlobe"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.linkedin)"
        href="{{ user.linkedin | completeurl : 'linkedin' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faLinkedin"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.twitter)"
        href="{{ user.twitter | completeurl : 'twitter' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faTwitter"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.github)"
        href="{{ user.github | completeurl : 'github' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faGithub"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.youtube)"
        href="{{ user.youtube | completeurl : 'youtube' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faYoutube"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.medium)"
        href="{{ user.medium | completeurl : 'medium' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faMediumM"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.dribbble)"
        href="{{ user.dribbble | completeurl : 'dribbble' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faDribbble"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.gitlab)"
        href="{{ user.gitlab | completeurl : 'gitlab' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faGitlab"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.facebook)"
        href="{{ user.facebook | completeurl : 'facebook' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faFacebook"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
      <a
        *ngIf="isValid(user.instagram)"
        href="{{ user.instagram | completeurl : 'instagram' }}"
        rel="noreferrer"
        target="_blank"
      >
        <app-badge
          [faIcon]="faInstagram"
          [fontColor]="'com-text-primary-500'"
          [fontSize]="'regular'"
          [borderRadius]="'round'"
          [color]="'com-bg-blue-50'"
        ></app-badge>
      </a>
    </div>
  </com-card-body>
</com-card>
