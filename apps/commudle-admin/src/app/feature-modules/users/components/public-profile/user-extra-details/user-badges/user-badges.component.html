<com-card *ngIf="badges.length > 0" class="user-badges" id="badges">
  <com-card-header>
    <a [routerLink]="'.'" fragment="badges">
      <fa-icon [icon]="faAward" class="com-text-Chrome-Yellow"></fa-icon>
      Badges
    </a>
  </com-card-header>
  <com-card-body>
    <img
      *ngFor="let badge of badges"
      [alt]="badge.name"
      [nbTooltip]="badge.name"
      [src]="badge.image?.url"
      [title]="badge.name"
    />
  </com-card-body>
</com-card>
