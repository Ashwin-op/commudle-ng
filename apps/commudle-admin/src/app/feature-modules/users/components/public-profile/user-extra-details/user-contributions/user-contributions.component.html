<com-card *ngIf="showBuilds && builds?.length > 0" class="contribution-card" id="builds">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="faLightbulb" class="com-text-Caribbean-Green icon"></fa-icon>
      Builds
      <a [routerLink]="'.'" fragment="builds" class="anchor-link" aria-label="Link to user-builds section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="grid">
      <app-user-build-card
        *ngFor="let build of builds"
        [build]="build"
        [showBuildAuthor]="currentUser?.id !== build.user?.id"
      ></app-user-build-card>
    </div>
  </com-card-body>
</com-card>

<com-card *ngIf="showLabs && labs?.length > 0" class="contribution-card" id="labs">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="faBookOpen" class="com-text-Infra-Red icon"></fa-icon>
      Labs
      <a [routerLink]="'.'" fragment="labs" class="anchor-link" aria-label="link to user-Labs section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="grid">
      <app-user-lab-card *ngFor="let lab of labs" [lab]="lab"></app-user-lab-card>
    </div>
  </com-card-body>
</com-card>

<com-card *ngIf="showTalksAtEvents && pastEvents?.length > 0" class="contribution-card" id="talks-at-events">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="faCalendar" class="com-text-Azure icon"></fa-icon>
      Talks at Events
      <a [routerLink]="'.'" fragment="talks-at-events" class="anchor-link" aria-label="Link to Talks-at-events section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="grid">
      <app-user-past-event-card *ngFor="let pastEvent of pastEvents" [pastEvent]="pastEvent"></app-user-past-event-card>
    </div>
  </com-card-body>
</com-card>

<com-card *ngIf="showAttendedEvents && attendedEvents?.length > 0" class="contribution-card" id="attended-events">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="faIdBadge" class="com-text-Caribbean-Green icon"></fa-icon>
      Attended Events
      <a [routerLink]="'.'" fragment="attended-events" class="anchor-link" aria-label="Link to attended-events section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="attended-badge">
      <span class="badge-count">{{ attendedEventsTotal }}</span>
      <span class="badge-text">events attended</span>
    </div>
    <div class="attended-table">
      <div class="attended-table-header">
        <span class="col-date">DATE</span>
        <span class="col-event">EVENT</span>
        <span class="col-community">COMMUNITY</span>
      </div>
      <div class="attended-table-row" *ngFor="let attendedEvent of attendedEvents">
        <div class="col-date">
          <span class="date-text">{{ attendedEvent.start_time | date : 'd MMM yyyy' }}</span>
        </div>
        <div class="col-event-community">
          <a
            class="event-link"
            [routerLink]="[
              '/communities',
              attendedEvent.kommunity_slug || attendedEvent.community?.slug,
              'events',
              attendedEvent.slug
            ]"
          >
            {{ attendedEvent.name }}
          </a>
          <ng-container *appBreakpoints="'<=md'">
            <div class="col-community-mobile" *ngIf="attendedEvent.kommunity">
              <app-community-badge [community]="attendedEvent.kommunity" size="small"></app-community-badge>
            </div>
          </ng-container>
        </div>
        <ng-container *appBreakpoints="'>md'">
          <div class="col-community-desktop" *ngIf="attendedEvent.kommunity">
            <app-community-badge [community]="attendedEvent.kommunity" size="small"></app-community-badge>
          </div>
        </ng-container>
      </div>
    </div>
  </com-card-body>
  <com-card-footer
    (click)="loadMoreAttendedEvents()"
    class="view-more-footer"
    *ngIf="attendedEventsTotal > attendedEvents.length"
  >
    <div>
      View More ({{ attendedEventsTotal - attendedEvents.length }})
      <nb-icon icon="arrow-ios-downward-outline"></nb-icon>
    </div>
  </com-card-footer>
</com-card>

<com-card *ngIf="showCommunities && communities?.length > 0" class="contribution-card" id="communities">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="faUsers" class="com-text-Chrome-Yellow icon"></fa-icon>
      Communities
      <a [routerLink]="'.'" fragment="communities" class="anchor-link" aria-label="Link to user-communities section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="grid">
      <app-user-community-card
        *ngFor="let community of communities | sortBy : ['user_role.id'] : ['desc']"
        [community]="community"
      ></app-user-community-card>
    </div>
  </com-card-body>
  <com-card-footer
    (click)="viewMoreCommunities()"
    class="view-more-footer"
    *ngIf="communitiesTotal !== communities.length"
  >
    <div>
      {{ footerCommunitiesCardText }}
      <nb-icon icon="arrow-ios-downward-outline"></nb-icon>
    </div>
  </com-card-footer>
</com-card>
