<com-card *ngIf="!isLoading && judges.length > 0" id="hackathons-mentor-judge">
  <com-card-header>
    <div class="section-heading-anchor heading">
      <fa-icon [icon]="icons.faGavel" class="com-text-Azure icon"></fa-icon>
      Hackathon Mentor/Judge
      <a
        [routerLink]="'.'"
        fragment="hackathons-mentor-judge"
        class="anchor-link"
        aria-label="Link to hackathon mentor/judge section"
      >
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </div>
  </com-card-header>
  <com-card-body>
    <div class="grid">
      <commudle-user-hackathon-role-card
        *ngFor="let entry of judges"
        [hackathon]="entry.hackathon"
        [roleLabel]="getRoleLabel(entry.judge_type)"
        [roleIcon]="getRoleIcon(entry.judge_type)"
        [roleKey]="entry.judge_type"
      ></commudle-user-hackathon-role-card>
    </div>
  </com-card-body>
</com-card>
