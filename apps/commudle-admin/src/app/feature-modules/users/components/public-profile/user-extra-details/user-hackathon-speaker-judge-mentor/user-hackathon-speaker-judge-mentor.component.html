<nb-card *ngIf="!isLoading && entries.length > 0" id="hackathons-speaker-judge-mentor">
  <nb-card-header>
    <a [routerLink]="'.'" fragment="hackathons-speaker-judge-mentor">
      <fa-icon [icon]="icons.faGavel" class="com-text-Azure"></fa-icon>
      Speaker / Judge / Mentor
      <span>({{ entries.length }})</span>
    </a>
  </nb-card-header>
  <nb-card-body>
    <div class="grid">
      <a
        *ngFor="let entry of entries"
        class="com-no-underline"
        [routerLink]="['/communities', entry.hackathon.community?.slug, 'hackathons', entry.hackathon.slug]"
      >
        <com-card class="role-card">
          <div class="card-banner">
            <img
              *ngIf="entry.hackathon.banner_image?.url"
              [src]="entry.hackathon.banner_image.url"
              [alt]="entry.hackathon.name"
            />
            <div *ngIf="!entry.hackathon.banner_image?.url" class="card-banner-placeholder">
              <fa-icon [icon]="getRoleIcon(entry.judge_type)"></fa-icon>
            </div>
            <span class="role-badge" [attr.data-role]="entry.judge_type">
              <fa-icon [icon]="getRoleIcon(entry.judge_type)"></fa-icon>
              {{ getRoleLabel(entry.judge_type) }}
            </span>
          </div>

          <div class="card-content">
            <h4 class="card-title">{{ entry.hackathon.name }}</h4>
            <div class="card-meta">
              <span *ngIf="entry.hackathon.start_date" class="meta-item">
                <fa-icon [icon]="icons.faCalendarAlt"></fa-icon>
                {{ entry.hackathon.start_date | date : 'MMM yyyy' }}
              </span>
              <div *ngIf="entry.hackathon.community" class="community-badge">
                <app-community-badge [community]="entry.hackathon.community" [size]="'small'"></app-community-badge>
              </div>
            </div>
          </div>
        </com-card>
      </a>
    </div>
  </nb-card-body>
</nb-card>
