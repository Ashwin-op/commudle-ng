<com-card class="resume-card">
  <com-card-body>
    <div class="resume-info">
      <div class="resume-icon">
        <nb-icon icon="file-text-outline"></nb-icon>
      </div>
      <div class="resume-details">
        <p class="name">{{ userResume.name }}</p>
        <p class="date">Updated {{ userResume.updated_at | date : 'MMM d, yyyy' }}</p>
      </div>
    </div>
    <div class="resume-actions">
      <button (click)="updateUserResume.emit()" class="action-btn">
        <nb-icon icon="edit"></nb-icon>
        <span>Edit</span>
      </button>
      <button (click)="copyTextToClipboard()" class="action-btn">
        <nb-icon icon="share"></nb-icon>
        <span>Share</span>
      </button>
      <a [href]="resumeLink" target="_blank" class="action-btn primary">
        <nb-icon icon="eye"></nb-icon>
        <span>Preview</span>
      </a>
      <div class="action-divider"></div>
      <button (click)="onDialogOpen(deleteResumeDialog)" class="action-btn danger">
        <nb-icon icon="trash"></nb-icon>
      </button>
    </div>
  </com-card-body>
</com-card>

<ng-template #deleteResumeDialog let-ref="dialogRef">
  <com-card class="delete-dialog">
    <com-card-header>
      <span class="com-flex com-items-center com-gap-2 com-text-base com-font-semibold com-text-Yankees-Blue">
        <nb-icon icon="alert-triangle" status="warning"></nb-icon>
        Confirmation
      </span>
      <button (click)="ref.close()" ghost nbButton size="small" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body class="com-max-w-[350px]">
      <p class="com-text-sm com-text-gray-700">
        Are you sure you want to delete
        <em>{{ userResume.name }}</em
        >?
      </p>
      <br />
      <p class="com-text-sm com-text-gray-500"><strong>Note:</strong>&nbsp;This action cannot be undone.</p>
    </com-card-body>
    <com-card-footer>
      <button (click)="ref.close()" ghost nbButton status="danger">No</button>
      <button (click)="deleteUserResume(); ref.close()" nbButton status="success">Yes</button>
    </com-card-footer>
  </com-card>
</ng-template>
