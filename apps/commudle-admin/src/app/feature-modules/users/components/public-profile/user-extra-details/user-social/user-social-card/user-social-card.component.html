<com-card class="user-social-card">
  <com-card-body class="card-body">
    <a [href]="socialResource.link" rel="noreferrer" target="_blank">
      <commudle-banner-image
        *appBreakpoints="'>lg'"
        [aspectRatio]="'3/2'"
        class="user-social-card-image"
        [headerImagePath]="socialResource.image?.i160"
        [name]="socialResource.title"
      ></commudle-banner-image>
      <commudle-banner-image
        *appBreakpoints="'<=lg'"
        [aspectRatio]="'2/1'"
        class="user-social-card-image"
        [headerImagePath]="socialResource.image?.i160"
        [name]="socialResource.title"
      ></commudle-banner-image>
    </a>
    <a [href]="socialResource.link" class="user-social-card-details" rel="noreferrer" target="_blank">
      <div class="content-button">
        <div class="content">
          <p class="user-social-card-title">{{ socialResource.title }}</p>
          <p class="user-social-card-description">{{ socialResource.description | truncatetext : 150 }}</p>
        </div>
        <button
          (click)="onDialogOpen($event)"
          *ngIf="currentUser?.id === user.id"
          class="user-social-card-delete"
          ghost
          nbButton
          status="danger"
        >
          Delete
        </button>
      </div>
      <div class="tags-favicon">
        <div class="user-social-card-tags">
          <div *ngFor="let tag of socialResource.tags" class="user-social-card-tag">{{ tag.name }}</div>
        </div>
        <img
          [alt]="socialResource.title"
          [src]="socialResource.favicon"
          [title]="socialResource.title"
          class="user-social-card-favicon"
        />
      </div>
    </a>
  </com-card-body>
</com-card>

<ng-template #confirmationDialog let-ref="dialogRef">
  <com-card>
    <com-card-header class="com-flex com-items-center com-justify-between">
      <span>Delete Resource</span>
      <button (click)="ref.close()" ghost nbButton size="small" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </com-card-header>
    <com-card-body>
      <p>
        Are you sure you want to delete
        <em>{{ socialResource.title }}</em>
        ?
      </p>
    </com-card-body>
    <com-card-footer class="com-flex com-justify-between">
      <button (click)="ref.close()" nbButton status="danger">Cancel</button>
      <button (click)="onDeleteResource(ref)" ghost nbButton status="success">Yes</button>
    </com-card-footer>
  </com-card>
</ng-template>
