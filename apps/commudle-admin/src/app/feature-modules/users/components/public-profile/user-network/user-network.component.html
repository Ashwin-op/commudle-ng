<com-card class="user-network-container">
  <com-card-header>
    <button ghost nbButton routerLink=".">
      <nb-icon icon="arrow-back"></nb-icon>
      Back to profile
    </button>
  </com-card-header>
  <com-card-body>
    <div class="route-tabs">
      <a routerLink="./following" routerLinkActive="active">
        <div class="route-tab-option">
          <span>FOLLOWING</span>
        </div>
      </a>
      <a routerLink="./followers" routerLinkActive="active">
        <div class="route-tab-option">
          <span>FOLLOWERS</span>
        </div>
      </a>
    </div>

    <router-outlet></router-outlet>
  </com-card-body>
</com-card>
