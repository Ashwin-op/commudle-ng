<a [routerLink]="['/communities', hackathon.community.slug, 'hackathons', hackathon.slug]">
  <nb-card class="hackathon-card">
    <nb-card-body>
      <div class="hackathon-horizontal-card">
        <div class="hackathon-image">
          <commudle-banner-image
            [headerImagePath]="hackathon.banner_image ? hackathon.banner_image.url : staticAssets.hackathon_empty_state"
            [name]="hackathon.name"
            [bottomLeftCurve]="false"
            [bottomRightCurve]="false"
          ></commudle-banner-image>
        </div>

        <div class="hackathon-details">
          <div class="title-row">
            <div class="name">
              {{ hackathon.name }}
            </div>
            <small *ngIf="hackathon.hackathon_collaboration_communities_count > 0" class="collaboration-text">
              Collaboration
            </small>
          </div>

          <div class="meta-row">
            <div class="date-chip" *ngIf="hackathon.start_date">
              Starts {{ moment(hackathon.start_date).format('MMM Do, YYYY') }}
            </div>
            <div class="location-chip">{{ hackathon.hackathon_location_type | titlecase }}</div>
          </div>

          <div class="prize-action-row">
            <div class="prize">
              <div *ngIf="totalPrizesByCurrency.length > 0 && totalPrizesByCurrency[0].amount > 0">
                <div class="prize-label">Prize Money</div>
                <div *ngFor="let item of totalPrizesByCurrency" class="prize-amount">
                  {{ item.currency.symbol }}{{ item.amount }}
                </div>
              </div>
            </div>

            <div class="action-button">
              <button nbButton status="primary" shape="semi-round" size="small">Register Now</button>
            </div>
          </div>
        </div>
      </div>
    </nb-card-body>
  </nb-card>
</a>
