<a [routerLink]="['/communities', hackathon.community.slug, 'hackathons', hackathon.slug]">
  <com-card class="hackathon-card">
    <com-card-body>
      <div class="hackathon-horizontal-card">
        <div>
          <div *appBreakpoints="'>md'" class="hackathon-image" [ngStyle]="{ width: headerImageWidth }">
            <commudle-banner-image
              [headerImagePath]="
                hackathon.banner_image ? hackathon.banner_image.url : staticAssets.hackathon_empty_state
              "
              [name]="hackathon.name"
              [bottomLeftCurve]="false"
              [bottomRightCurve]="false"
            ></commudle-banner-image>
          </div>
          <div *appBreakpoints="'<=md'" class="hackathon-image com-w-full">
            <commudle-banner-image
              [headerImagePath]="
                hackathon.banner_image ? hackathon.banner_image.url : staticAssets.hackathon_empty_state
              "
              [name]="hackathon.name"
              [bottomLeftCurve]="false"
              [bottomRightCurve]="false"
            ></commudle-banner-image>
          </div>
        </div>

        <div class="hackathon-details">
          <div class="title-row">
            <p class="name" [ngClass]="{ 'gradient-effect-title': showGradientEffect }">
              {{ hackathon.name }}
              <span
                *ngIf="hackathon.hackathon_collaboration_communities_count > 0"
                class="collaboration-text"
                [ngClass]="{ 'gradient-effect-meta': showGradientEffect }"
              >
                (Collaboration)
              </span>
            </p>
          </div>

          <div class="meta-row">
            <p
              class="date-chip"
              *ngIf="hackathon.start_date"
              [ngClass]="{ 'gradient-effect-meta': showGradientEffect }"
            >
              Starts {{ moment(hackathon.start_date).format('MMM Do, YYYY') }}
            </p>
            <button
              nbButton
              size="tiny"
              class="event-type-button"
              [ngClass]="{ 'gradient-effect-event-type-button': showGradientEffect }"
            >
              <fa-icon [icon]="faMapPin"></fa-icon>
              {{ hackathon.hackathon_location_type | titlecase }}
            </button>
          </div>

          <div class="interested-register-row">
            <div class="prize">
              <div *ngIf="totalPrizesByCurrency.length > 0 && totalPrizesByCurrency[0].amount > 0">
                <div class="prize-label">Prize Money</div>
                <div *ngFor="let item of totalPrizesByCurrency" class="prize-amount">
                  {{ item.currency.symbol }}{{ item.amount }}
                </div>
              </div>
            </div>

            <button nbButton status="primary" shape="semi-round" size="small" outline class="register-button">
              Register
            </button>
          </div>
        </div>
      </div>
    </com-card-body>
  </com-card>
</a>
