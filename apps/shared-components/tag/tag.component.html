<div
  class="tag-list"
  [ngClass]="{
    editable: editable,
    rounded: shape === 'rounded',
    'semi-round': shape === 'semi-round',
    rectangle: shape === 'rectangle',
    'input-small': inputSize === 'small',
    'input-medium': inputSize === 'medium'
  }"
>
  <span
    class="tag"
    *ngFor="let tag of getTags()"
    [ngClass]="{ tiny: size === 'tiny' }"
    class="{{ backgroundColor }} {{ fontColor }}"
  >
    {{ tag }}
    <fa-icon *ngIf="editable" class="remove-icon" (click)="onTagRemove(tag)" [icon]="faXmark"> </fa-icon>
  </span>

  <form [formGroup]="searchForm">
    <input
      (keydown)="onKeyDown($event)"
      (keyup.enter)="addTagFromInput($event)"
      *ngIf="editable"
      [disabled]="inputDisabled"
      fullWidth
      formControlName="q"
      [placeholder]="
        minTagLimit
          ? 'Type something and press enter or comma to keep adding (At least ' + minimumTags + ' tags)'
          : label
      "
      type="text"
      [nbAutocomplete]="autoControl"
    />
    <nb-autocomplete #autoControl (selectedChange)="onTagAdd($event)">
      <nb-option *ngFor="let tag of autoCompleteTags" [value]="tag.name">
        {{ tag.name }}
      </nb-option>
    </nb-autocomplete>
  </form>
</div>

<div *ngIf="showSuggestedTags">
  <div class="suggested-tags">
    <span class="suggested-tag" *ngFor="let tag of suggestedTags" (click)="onTagAdd(tag.name)">
      {{ tag.name }}
    </span>
  </div>
</div>
