<form [formGroup]="userForm" *ngIf="userForm">
  <div class="com-flex">
    <div *ngIf="uploadedProfilePicture === null" class="uploaded-profile"></div>
    <div *ngIf="uploadedProfilePicture" class="uploaded-profile-image">
      <img alt="Profile Picture" src="{{ uploadedProfilePicture }}" title="Profile Picture" class="center" />
    </div>
    <!-- input for file upload -->
    <div class="com-w-full">
      <div class="com-border com-rounded-lg com-border-dashed com-bg-[#E4E9F2]/40 com-border-gray-500 com-relative">
        <input
          (change)="displaySelectedProfileImage($event)"
          type="file"
          accept="image/*"
          class="com-cursor-pointer com-relative com-block com-opacity-0 com-w-full com-h-full com-p-16 com-z-50"
        />
        <div class="com-text-center com-absolute com-top-8 com-right-0 com-left-0 com-m-auto com-text-gray-400">
          <fa-icon [icon]="faFileImage" class="com-text-5xl"></fa-icon>
          <p>
            Drag file here
            <br />
            or<span class="com-text-primary-500"> BROWSE </span>
          </p>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="userForm.get('name')">
    <label for="name">Your Name <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="name" placeholder="Enter your full name" />
    <commudle-alert
      *ngIf="userForm.get('name').touched && userForm.get('name').invalid && userForm.get('name').errors.required"
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('designation')">
    <label for="name">Designation/Tagline <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="designation" placeholder="e.g. Software Engineer at Google" />
    <commudle-alert
      *ngIf="
        userForm.get('designation').touched &&
        userForm.get('designation').invalid &&
        userForm.get('designation').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
    <span
      *ngIf="
        userForm.get('designation').touched &&
        userForm.get('designation').invalid &&
        userForm.get('designation').errors.maxlength
      "
    >
      <commudle-alert [error]="true" [errorMessage]="'Maximum 300 characters allowed'"></commudle-alert>
    </span>
  </div>
  <div *ngIf="userForm.get('about_me')">
    <label for="name">About Me<span class="required">*</span></label>
    <textarea
      name="about_me"
      id="about_me"
      rows="3"
      nbInput
      fullWidth
      formControlName="about_me"
      placeholder="Tell us a little about yourself, your interests, and what you do"
    ></textarea>
    <span
      *ngIf="
        userForm.get('about_me').touched && userForm.get('about_me').invalid && userForm.get('about_me').errors.required
      "
    >
      <commudle-alert [error]="true" [errorMessage]="'Required field'"></commudle-alert>
    </span>
    <span
      *ngIf="
        userForm.get('about_me').touched &&
        userForm.get('about_me').invalid &&
        userForm.get('about_me').errors.minlength
      "
    >
      <commudle-alert [error]="true" [errorMessage]="'Minimum 30 characters required'"></commudle-alert>
    </span>
    <span
      *ngIf="
        userForm.get('about_me').touched &&
        userForm.get('about_me').invalid &&
        userForm.get('about_me').errors.maxlength
      "
    >
      <commudle-alert [error]="true" [errorMessage]="'Maximum 2600 characters allowed'"></commudle-alert>
    </span>
  </div>
  <div *ngIf="userForm.get('location')">
    <label for="name">Location <span class="required">*</span></label>
    <input
      type="text"
      nbInput
      fullWidth
      id="addressInput"
      formControlName="location"
      placeholder="e.g. Bangalore, India"
    />
    <commudle-alert
      *ngIf="
        userForm.get('location').touched && userForm.get('location').invalid && userForm.get('location').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('experience_level')">
    <label for="name"
      >Experience Level
      <span class="required">*</span>
    </label>
    <select formControlName="experience_level" class="experience-select">
      <option value="" selected disabled>Select your experience</option>
      <optgroup label="Student">
        <option
          *ngFor="let experienceLevel of EExperienceLevel | keyvalue : originalOrder | slice : 0 : 3"
          [value]="experienceLevel.key"
        >
          {{ experienceLevel.value }}
        </option>
      </optgroup>

      <optgroup label="Professional (NOT STUDYING IN SCHOOL OR COLLEGE)">
        <option
          *ngFor="let experienceLevel of EExperienceLevel | keyvalue : originalOrder | slice : 3"
          [value]="experienceLevel.key"
        >
          {{ experienceLevel.value }}
        </option>
      </optgroup>
    </select>
    <commudle-alert
      *ngIf="
        userForm.get('experience_level').touched &&
        userForm.get('experience_level').invalid &&
        userForm.get('experience_level').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('user_domain')">
    <label for="name">User Domain <span class="required">*</span></label>
    <select formControlName="user_domain" class="domain-select">
      <option value="" selected disabled>Select your domain</option>
      <option *ngFor="let domain of EDomain | keyvalue : originalOrder" [value]="domain.key">
        {{ domain.value }}
      </option>
      <option value="other">Other</option>
    </select>
    <commudle-alert
      *ngIf="
        userForm.get('user_domain').touched &&
        userForm.get('user_domain').invalid &&
        userForm.get('user_domain').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('work_experience_months')">
    <label for="name">Your Work Experience in Years <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="work_experience_months" placeholder="e.g. 3" />
    <commudle-alert
      *ngIf="
        userForm.get('work_experience_months').touched &&
        userForm.get('work_experience_months').invalid &&
        userForm.get('work_experience_months').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('education')">
    <label for="name">Your education <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="education" placeholder="e.g. B.Tech in Computer Science" />
    <commudle-alert

  <div *ngIf="userForm.get('phone')">
    <label for="name">Your Phone Number <span class="required">*</span></label>
    <input type="number" nbInput fullWidth formControlName="phone" placeholder="e.g. 9876543210" />
    <commudle-alert
      *ngIf="userForm.get('phone').touched && userForm.get('phone').invalid && userForm.get('phone').errors.required"
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('email')">
    <label for="name">Your email <span class="required">*</span></label>
    <input type="email" nbInput fullWidth formControlName="email" readonly placeholder="your@email.com" />
  </div>
  <div *ngIf="userForm.get('twitter')">
    <label for="name">Twitter <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="twitter" placeholder="https://twitter.com/yourhandle" />
    <commudle-alert
      *ngIf="
        userForm.get('twitter').touched && userForm.get('twitter').invalid && userForm.get('twitter').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
    <commudle-alert
      [error]="
        userForm.get('twitter').touched &&
        userForm.get('twitter').invalid &&
        userForm.get('twitter').hasError('pattern')
      "
      errorMessage="Enter complete url (https://....)"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('linkedin')">
    <label for="name">Linkedin <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="linkedin" placeholder="https://linkedin.com/in/yourprofile" />
    <commudle-alert
      *ngIf="
        userForm.get('linkedin').touched && userForm.get('linkedin').invalid && userForm.get('linkedin').errors.required
      "

    ></commudle-alert>
    <commudle-alert
      [error]="
        userForm.get('linkedin').touched &&
        userForm.get('linkedin').invalid &&
        userForm.get('linkedin').hasError('pattern')
      "
      errorMessage="Enter complete url (https://....)"
    ></commudle-alert>
  </div>

    <label for="name">Dribbble <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="dribbble" placeholder="https://dribbble.com/yourprofile" />
    <commudle-alert

    <label for="name">Youtube <span class="required">*</span></label>

    <commudle-alert
      *ngIf="

  <div *ngIf="userForm.get('gitlab')">
    <label for="name">Gitlab <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="gitlab" placeholder="https://gitlab.com/yourusername" />
    <commudle-alert
      *ngIf="userForm.get('gitlab').touched && userForm.get('gitlab').invalid && userForm.get('gitlab').errors.required"

      [error]="

    <label for="name">Github <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="github" placeholder="https://github.com/yourusername" />
    <commudle-alert
      *ngIf="userForm.get('github').touched && userForm.get('github').invalid && userForm.get('github').errors.required"

    ></commudle-alert>
    <commudle-alert

        userForm.get('github').touched && userForm.get('github').invalid && userForm.get('github').hasError('pattern')
      "

    ></commudle-alert>

  <div *ngIf="userForm.get('facebook')">
    <label for="name">Facebook <span class="required">*</span></label>
    <input type="text" nbInput fullWidth formControlName="facebook" placeholder="https://facebook.com/yourprofile" />
    <commudle-alert
      *ngIf="
        userForm.get('facebook').touched && userForm.get('facebook').invalid && userForm.get('facebook').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
    <commudle-alert
      [error]="
        userForm.get('facebook').touched &&
        userForm.get('facebook').invalid &&
        userForm.get('facebook').hasError('pattern')
      "
      errorMessage="Enter complete url (https://....)"
    ></commudle-alert>
  </div>
  <div *ngIf="userForm.get('tshirt_size')">
    <label for="tshirt_size">T shirt size <span class="required">*</span></label>
    <select
      name="tshirt_size"
      id="tshirt_size"
      formControlName="tshirt_size"
      [ngClass]="{
        'com-text-[#8E9BB3]': userForm.get('tshirt_size').value === null
      }"
    >
      <option selected disabled [value]="null">Select T-shirt size</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>
      <option value="XXXL">XXXL</option>
    </select>
    <commudle-alert
      *ngIf="
        userForm.get('tshirt_size').touched &&
        userForm.get('tshirt_size').invalid &&
        userForm.get('natshirt_sizeme').errors.required
      "
      [error]="true"
      [errorMessage]="'Required Field'"
    ></commudle-alert>
  </div>
  <div class="action-buttons" *ngIf="showActionButtons">
    <button status="primary" nbButton disabled>Previous</button>
    <button
      status="primary"
      nbButton
      [disabled]="userForm.invalid || isSubmitting"
      [nbSpinner]="isSubmitting"
      nbSpinnerSize="tiny"
      nbSpinnerStatus="control"
      (click)="submitUserDetails()"
    >
      {{ submitButtonText }}
    </button>
  </div>
</form>
