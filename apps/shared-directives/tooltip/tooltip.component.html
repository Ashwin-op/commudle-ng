<div
  class="tooltip-box"
  [ngClass]="{
    'tooltip-top': placement === 'top',
    'tooltip-bottom': placement === 'bottom',
    'tooltip-left': placement === 'left',
    'tooltip-right': placement === 'right',
    'tooltip-sm': size === 'sm',
    'tooltip-md': size === 'md',
    'tooltip-lg': size === 'lg',
    'tooltip-card': variant === 'card',
    'tooltip-rich': !!template && variant !== 'card'
  }"
  role="tooltip"
  [id]="id"
  [style.--tooltip-dot-offset]="dotOffset + 'px'"
  (mouseenter)="hoverChange.emit(true)"
  (mouseleave)="hoverChange.emit(false)"
>
  <com-card *ngIf="variant === 'card'; else content">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </com-card>

  <ng-template #content>
    <ng-container *ngIf="template; else plainText">
      <ng-container *ngTemplateOutlet="template"></ng-container>
    </ng-container>
  </ng-template>
  <ng-template #plainText
    ><span class="tooltip-text">{{ text }}</span></ng-template
  >

  <span *ngIf="dot" class="tooltip-dot"></span>
</div>
