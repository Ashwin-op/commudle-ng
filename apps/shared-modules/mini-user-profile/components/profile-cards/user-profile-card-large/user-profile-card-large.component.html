<div [ngClass]="{ 'align-right': alignFollowToRight, 'com-w-72': horizontalScroll }" class="com-bg-white">
  <a (click)="profileClicked()" [routerLink]="['/users', user.username]" target="_blank">
    <div class="user-profile-large d-flex align-items-start">
      <div>
        <img
          [activateMiniProfileDirective]="activateMiniProfileDirective"
          [alt]="user.name"
          [ngClass]="{ 'com-self-start': showAbout && user.about_me }"
          [src]="user.photo?.i64"
          [title]="user.name"
          [username]="user.username"
          appMiniUserProfile
          class="avatar"
        />
      </div>
      <div class="details">
        <div class="name-header">
          <div class="name" [ngClass]="{ 'align-right-speaker-count': alignSpeakerCountToRight }">
            <p
              [activateMiniProfileDirective]="activateMiniProfileDirective"
              [username]="user.username"
              appMiniUserProfile
            >
              {{ user.name }}
            </p>
            <commudle-user-expert-tick *ngIf="user.is_expert"></commudle-user-expert-tick>
            <commudle-user-personal-connect
              [userConnect]="user.distance_from_current_user"
            ></commudle-user-personal-connect>
          </div>
          <div *ngIf="showSpeakersCount && alignSpeakerCountToRight" class="speaker-count">
            <app-badge
              *ngIf="user.speaker_events_count > 0"
              [text]="user.speaker_events_count + (user.speaker_events_count > 1 ? ' Talks Given' : ' Talk Given')"
              [fontColor]="'com-text-tAuro-Metal-Saurus'"
              [fontSize]="'x-small'"
              [borderRadius]="'round'"
              [color]="'com-bg-Bright-Gray-opacity-60'"
            ></app-badge>
          </div>
        </div>
        <p class="username" title="{{ user.username }}">&#64;{{ user.username | truncatetext : maxUserNameLength }}</p>
        <app-hiring-looking-works-tags
          *ngIf="showHiringLookingTags"
          [user]="user"
          [size]="'small'"
        ></app-hiring-looking-works-tags>
        <p
          [ngClass]="{ 'com-line-clamp-2': truncateDesignation, 'com-h-12': horizontalScroll }"
          class="designation"
          title="{{ user.designation }}"
        >
          {{ user.designation || '--' }}
        </p>
        <p *ngIf="user.followers_count > 0 && showFollowersCount" class="followers-count">
          <span>{{ user.followers_count }}</span> Follower{{ user.followers_count > 1 ? 's' : '' }}
        </p>
        <div *ngIf="(showSpeakersCount && !alignSpeakerCountToRight) || showLeaderBadge" class="talks-leader">
          <button
            *ngIf="showLeaderBadge && user.is_community_leader"
            nbButton
            shape="round"
            size="tiny"
            outline
            class="leader"
          >
            Leader
          </button>
          <div
            *ngIf="showSpeakersCount && !alignSpeakerCountToRight"
            class="speaker-count"
            [ngClass]="{ 'desktop-speaker-count': !alignSpeakerCountToRight }"
          >
            <app-badge
              *ngIf="user.speaker_events_count > 0"
              [text]="user.speaker_events_count + (user.speaker_events_count > 1 ? ' Talks Given' : ' Talk Given')"
              [fontColor]="'com-text-tAuro-Metal-Saurus'"
              [fontSize]="'xx-small'"
              [borderRadius]="'round'"
              [color]="'com-bg-Bright-Gray-opacity-60'"
            ></app-badge>
          </div>
        </div>
        <div *ngIf="showSocialLinks" class="social com-mt-2 com-flex com-gap-3">
          <a *ngIf="user.linkedin" [href]="user.linkedin | completeurl : 'linkedin'" target="_blank">
            <nb-icon icon="linkedin" status="primary"></nb-icon>
          </a>
          <a *ngIf="user.twitter" [href]="user.twitter | completeurl : 'twitter'" target="_blank">
            <nb-icon icon="twitter" status="primary"></nb-icon>
          </a>
          <a *ngIf="user.github" [href]="user.github | completeurl : 'github'" target="_blank">
            <nb-icon icon="github" status="primary"></nb-icon>
          </a>
          <a *ngIf="user.personal_website" [href]="user.personal_website | completeurl" target="_blank">
            <nb-icon icon="globe" status="primary"></nb-icon>
          </a>
          <a (click)="openChatWithUser()" class="clickable">
            <nb-icon icon="message-circle-outline" status="basic"></nb-icon>
          </a>
        </div>
        <p *ngIf="showAbout && user.about_me" class="about com-line-clamp-3">{{ user.about_me }}</p>
      </div>
    </div>
  </a>
  <div
    *ngIf="showFollowButton"
    [ngClass]="{ 'align-right': alignFollowToRight, 'com-mt-4': !alignFollowToRight }"
    class="followers"
  >
    <app-user-follow
      [username]="user.username"
      [name]="user.name"
      [userId]="user.id"
      [isMobileWidthFull]="isMobileWidthFull"
      [appearance]="appearanceOfFollowButton"
      class="follow-btn"
    ></app-user-follow>
  </div>
</div>
