<div *ngIf="currentUser?.id !== userId" class="user-follow">
  <button
    (click)="isFollowing ? toggleFollow() : onFollowClick()"
    [appearance]="appearance ?? (isFollowing || appearance === 'outline' ? 'outline' : 'filled')"
    [ngClass]="{ 'fixed-width': !showIcon, 'width-full': isMobileWidthFull }"
    [status]="status || 'info'"
    class="follow-btn"
    nbButton
    [shape]="round ? 'round' : 'semi-round'"
    size="small"
    [disabled]="disabled"
  >
    <nb-icon *ngIf="showIcon" [icon]="isFollowing ? 'checkmark' : 'plus'"></nb-icon>
    {{ isFollowing ? 'Following' : 'Follow' }}
  </button>
</div>
