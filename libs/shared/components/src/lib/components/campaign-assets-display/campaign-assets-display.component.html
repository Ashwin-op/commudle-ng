<div
  class="carousel"
  [class.preview]="campaignType === 'preview'"
  *ngIf="campaign && campaign.campaign_assets && campaign.campaign_assets.length > 0"
  #campaignImageContainer
>
  <div class="promoted-badge">
    Promoted<a [routerLink]="['/campaigns/new']" target="_blank"><fa-icon [icon]="faCircleQuestion"></fa-icon></a>
  </div>

  <div
    class="container"
    [ngStyle]="{
          transform: 'translateX(-' + currentSlide * 100 + '%)',
        }"
  >
    <div class="component-container-wrapper" *ngFor="let ca of campaign?.campaign_assets">
      <a [href]="ca?.url" target="_blank" (click)="createUserEngagementForCampaign(UserActivityEventType.CLICK)">
        <img [src]="ca.image?.url" class="slider-image" [alt]="ca.headline" [title]="ca.headline" />
        <div class="campaign-image-footer">
          <p class="campaign-url">{{ ca.url }}</p>
          <a [href]="ca.url" class="learn-more-button" size="small" outline nbButton shape="semi-round">{{
            campaign?.cta_label
          }}</a>
        </div>
      </a>
    </div>
  </div>

  <div class="slide-dots" *ngIf="campaignType === 'preview' && slidesCount > 1">
    <button
      type="button"
      class="slide-dot"
      *ngFor="let ca of campaign.campaign_assets; let i = index"
      [class.active]="i === currentSlide"
      [attr.aria-label]="'Show asset ' + (i + 1)"
      (click)="goToSlide(i)"
    ></button>
  </div>
</div>

<div
  *ngIf="!campaign || campaign?.campaign_assets?.length === 0"
  class="default-image-container"
  #defaultImageContainer
>
  <a
    class="header-image"
    [href]="defaultImageUrl"
    (click)="createUserEngagementForDefaultImage(UserActivityEventType.CLICK)"
    [ngClass]="{ 'com-pointer-events-none': !defaultImageUrl }"
  >
    <img [src]="defaultImage" class="com-w-full" />
  </a>
</div>
