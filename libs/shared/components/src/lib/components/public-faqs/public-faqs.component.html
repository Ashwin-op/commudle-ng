<com-card>
  <com-card-header>
    <fa-icon [icon]="faCircleQuestion" class="heading-icon"></fa-icon>
    <h2 class="heading section-heading-anchor">
      FAQs
      <a [routerLink]="['.']" fragment="faq" class="anchor-link" aria-label="link to FAQs section">
        <fa-icon [icon]="faHashtag" class="anchor-icon-small"></fa-icon>
      </a>
    </h2>
  </com-card-header>
  <com-card-body>
    <div *ngFor="let faq of faqs">
      <commudle-faq-card [faq]="faq"></commudle-faq-card>
    </div>
  </com-card-body>
</com-card>
