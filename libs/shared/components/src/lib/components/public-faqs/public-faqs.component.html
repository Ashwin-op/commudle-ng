<com-card>
  <com-card-header>
    <fa-icon [icon]="faCircleQuestion"></fa-icon>
    <h2>
      <a [routerLink]="['.']" fragment="faq"> FAQs </a>
    </h2>
  </com-card-header>
  <com-card-body>
    <div *ngFor="let faq of faqs">
      <commudle-faq-card [faq]="faq"></commudle-faq-card>
    </div>
  </com-card-body>
</com-card>
